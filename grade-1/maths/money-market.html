<!doctype html>
<html lang="en">
<head>

<title>Money Market</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">

<!--
  🛒 MONEY MARKET — Grade 1 maths game
  Shop in a little toy-and-snack shop: know your coins, count money, pay exactly, find the change.
  Works with mouse (computer) and touch (phone/tablet).
  To change the questions, prices or shop items, scroll to "EASY-TO-EDIT SETTINGS" in the script below.
-->
<style>
  :root {
    --ink: #1d3557;
    --card: rgba(255, 255, 255, 0.94);
    --pink: #ff4d6d;
    --saffron: #ff9f1c;
    --good: #2a9d8f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd89a;
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; }

  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 0; }
  .chip { pointer-events: auto; background: var(--card); color: var(--ink); border: 0; border-radius: 999px;
    min-height: 44px; min-width: 44px; padding: 4px 14px; font: inherit; font-size: 20px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 3px 0 rgba(0,0,0,.13); }
  button.chip { cursor: pointer; touch-action: manipulation; }
  #stats { gap: 14px; }
  #starCount.bump { animation: bump .5s; display: inline-block; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }

  #qcard { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    top: calc(62px + env(safe-area-inset-top)); width: min(92vw, 640px);
    background: var(--card); border-radius: 22px; padding: 6px 16px 8px; text-align: center; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.13); }
  #qcard.enter { animation: cardIn .35s ease-out; }
  @keyframes cardIn { from { transform: translateX(-50%) scale(.85); opacity: .3; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  #qtext { font-size: clamp(30px, 8vw, 50px); font-weight: 800; line-height: 1.15; }
  #qsub { font-size: clamp(16px, 4.2vw, 22px); font-weight: 600; opacity: .85; min-height: 1.3em; line-height: 1.3; }
  #qsub.hinting { color: #b5179e; opacity: 1; font-weight: 800; }

  #toast { position: fixed; z-index: 6; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(0);
    font-size: clamp(36px, 10vw, 64px); font-weight: 800; color: #fff; white-space: nowrap; pointer-events: none;
    text-shadow: 0 4px 0 var(--good), 0 8px 16px rgba(0,0,0,.25); }
  #toast.soft { text-shadow: 0 4px 0 #e76f51, 0 8px 16px rgba(0,0,0,.25); }
  #toast.show { animation: toastIn 1.3s ease-out forwards; }
  @keyframes toastIn {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    20% { transform: translate(-50%, -50%) scale(1.15); }
    35% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
  }

  /* answer chips and the pay bar, along the bottom */
  #bottom { position: fixed; z-index: 5; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; pointer-events: none; padding: 0 8px; }
  #answers, #paybar { pointer-events: auto; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .ans { font: inherit; font-size: clamp(28px, 8vw, 40px); font-weight: 800; min-width: 80px; height: 74px; padding: 0 14px;
    border: 0; border-radius: 22px; background: #fff; color: var(--ink); cursor: pointer; touch-action: manipulation;
    box-shadow: 0 6px 0 rgba(0,0,0,.22); line-height: 1; }
  .ans:active, .big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .ans.wrong { opacity: .35; filter: grayscale(1); animation: shake .4s; }
  .ans.hint { background: #ffe066; animation: pulse .8s ease-in-out infinite; }
  .ans.right { background: #8ac926; color: #fff; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #total { font-size: 28px; min-height: 64px; padding: 4px 20px; pointer-events: none; }
  #total b { font-size: 34px; }
  #payBtn { font-size: 32px; padding: 10px 30px; background: var(--good); min-height: 70px; }
  #payBtn.pulse { animation: pulse .8s ease-in-out infinite; background: #f4a100; }

  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px 16px; text-align: center;
    background: rgba(255, 216, 154, .42); }
  .overlay h1 { margin: 0; font-size: clamp(42px, 12vw, 80px); line-height: 1; color: #fff;
    text-shadow: 0 5px 0 #e85d04, 0 8px 18px rgba(0,0,0,.25); }
  .overlay .say { margin: 0; font-size: clamp(18px, 4.8vw, 24px); font-weight: 600;
    background: var(--card); padding: 6px 18px; border-radius: 16px; }
  .levels { display: flex; flex-direction: column; gap: 12px; width: min(88vw, 400px); margin-top: 6px; }
  .lvl { font: inherit; border: 0; border-radius: 22px; padding: 10px 18px; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
    box-shadow: 0 6px 0 rgba(0,0,0,.2); touch-action: manipulation; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .lvl:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .lvl b { font-size: 28px; display: block; line-height: 1.1; }
  .lvl small { font-size: 15px; font-weight: 600; }
  .lvl .best { font-size: 20px; white-space: nowrap; }
  .dim { filter: grayscale(1); opacity: .35; }
  .big { font: inherit; font-size: 26px; font-weight: 800; border: 0; border-radius: 20px; padding: 10px 28px;
    color: #fff; background: var(--pink); cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.2); touch-action: manipulation; }
  .big.alt { background: #fff; color: var(--ink); }
  #bigstars { font-size: clamp(60px, 17vw, 104px); letter-spacing: 6px; line-height: 1.1; }
  #newbest { color: #fff; font-weight: 800; font-size: 24px; text-shadow: 0 3px 0 var(--good); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hidden { display: none !important; }
  @media (max-height: 500px) { /* phone turned sideways */
    #qcard { top: calc(56px + env(safe-area-inset-top)); width: min(64vw, 560px); padding: 2px 12px 4px; }
    #qtext { font-size: 28px; }
    #qsub { font-size: 16px; }
    #bottom { bottom: calc(8px + env(safe-area-inset-bottom)); }
    .ans { height: 58px; font-size: 30px; min-width: 76px; }
    #total { min-height: 54px; font-size: 22px; }
    #total b { font-size: 28px; }
    #payBtn { font-size: 26px; padding: 6px 24px; min-height: 58px; }
    .overlay { gap: 8px; padding: 10px; }
    .overlay h1 { font-size: 40px; }
    .overlay h1 br { display: none; }
    .levels { flex-direction: row; width: min(96vw, 780px); }
    .lvl { flex: 1; flex-direction: column; align-items: flex-start; }
  }
</style>

<body>

<div id="topbar">
  <button class="chip hidden" id="homeBtn" aria-label="Home">🏠</button>
  <div class="chip hidden" id="stats"><span>⭐ <span id="starCount">0</span></span><span id="qnum">1 / 10</span></div>
  <button class="chip" id="muteBtn" aria-label="Sound on or off">🔊</button>
</div>

<div id="qcard" class="hidden" title="Tap to hear the question again">
  <div id="qtext"></div>
  <div id="qsub"></div>
</div>

<div id="toast"></div>

<div id="bottom">
  <div id="answers" class="hidden"></div>
  <div id="paybar" class="hidden">
    <div class="chip" id="total"></div>
    <button class="big" id="payBtn">Pay 💰</button>
  </div>
</div>

<div class="overlay" id="startScreen">
  <h1>🛒 Money<br>Market</h1>
  <p class="say">Shop with coins and notes!</p>
  <div class="levels" id="levels"></div>
</div>

<div class="overlay hidden" id="endScreen">
  <h1>Shop closed!</h1>
  <div id="bigstars"></div>
  <p class="say" id="endmsg"></p>
  <div id="newbest" class="hidden">🏆 New best score!</div>
  <div class="row">
    <button class="big" id="againBtn">Play again</button>
    <button class="big alt" id="levelBtn">Change level</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   EASY-TO-EDIT SETTINGS
   ===================================================================== */
const QUESTIONS_PER_ROUND = 10;

// Your own questions. If this list has ANY question in it, the game uses ONLY these.
// Money: 1, 2, 5, 10 are coins; 20 and 50 are notes; 'n10' is a ₹10 note.
// Items: ball, car, kite, pencil, banana, icecream, laddoo, balloon, drum, book
const MY_QUESTIONS = [
  // { type: 'coin',   value: 5 },                              // Tap the ₹5 coin!
  // { type: 'count',  money: [5, 2, 1] },                      // How much money is this?
  // { type: 'pay',    item: 'kite', price: 8 },                // Pay ₹8 with coins
  // { type: 'more',   items: [['kite', 12], ['ball', 9]] },    // Which costs more?
  // { type: 'canBuy', item: 'kite', price: 12, have: 10 },     // You have ₹10. Can you buy it?
  // { type: 'change', item: 'car', price: 15, paid: 20 },      // How much change?
  // { q: '₹5 + ₹3 = ?', say: 'What is 5 rupees and 3 rupees?', a: 8 },  // any number question
];

// The shop. price = [cheapest, dearest]; the game picks a price in this range that suits the level.
const SHOP_ITEMS = [
  { kind: 'ball',     name: 'ball',       emoji: '⚽', price: [3, 20] },
  { kind: 'car',      name: 'toy car',    emoji: '🚗', price: [8, 50] },
  { kind: 'kite',     name: 'kite',       emoji: '🪁', price: [4, 30] },
  { kind: 'pencil',   name: 'pencil',     emoji: '✏️', price: [1, 9] },
  { kind: 'banana',   name: 'bananas',    emoji: '🍌', price: [2, 12] },
  { kind: 'icecream', name: 'ice-cream',  emoji: '🍦', price: [5, 25] },
  { kind: 'laddoo',   name: 'laddoos',    emoji: '🟠', price: [3, 20] },
  { kind: 'balloon',  name: 'balloon',    emoji: '🎈', price: [1, 6] },
  { kind: 'drum',     name: 'drum',       emoji: '🥁', price: [15, 50] },
  { kind: 'book',     name: 'story book', emoji: '📘', price: [10, 45] },
];

// Question types: coin, count, pay, more, canBuy, change (a type listed twice comes up twice as often)
// Money keys: c1 c2 c5 c10 = coins, n10 n20 n50 = notes
const LEVELS = {
  easy:   { name: 'Easy',   emoji: '🐣', color: '#5fa61d', blurb: 'Know your coins · count & pay to ₹10',
            types: ['coin', 'coin', 'count', 'count', 'count', 'pay', 'pay', 'pay'],
            coinChoices: ['c1', 'c2', 'c5', 'c10'], countMoney: ['c1', 'c2'], countRange: [3, 10], countPieces: [2, 6],
            payRange: [2, 10], tray: ['c1', 'c2', 'c5'], chips: 3 },
  medium: { name: 'Medium', emoji: '🐯', color: '#f08c00', blurb: 'Count & pay to ₹20 · costs more?',
            types: ['count', 'count', 'pay', 'pay', 'pay', 'more', 'more', 'canBuy', 'canBuy'],
            countMoney: ['c1', 'c2', 'c5', 'c10'], countRange: [8, 20], countPieces: [2, 5],
            payRange: [6, 20], tray: ['c1', 'c2', 'c5', 'c10'], moreMax: 20, chips: 4 },
  hard:   { name: 'Hard',   emoji: '🦁', color: '#e63946', blurb: 'Notes · pay to ₹50 · change',
            types: ['pay', 'pay', 'pay', 'change', 'change', 'change', 'count', 'more'],
            countMoney: ['c1', 'c2', 'c5', 'c10', 'n10', 'n20'], countRange: [15, 50], countPieces: [2, 5],
            payRange: [15, 50], tray: ['c1', 'c2', 'c5', 'c10', 'n10', 'n20'], moreMax: 50,
            changeFrom: [10, 20, 50], fewestBonus: true, chips: 4 },
};

const PRAISE = ['Great job!', 'Super!', 'Well done!', 'Awesome!', 'You got it!', 'Fantastic!', 'Brilliant!', 'Shabaash!'];

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode: ignore */ } },
};
const rs = n => n === 1 ? '1 rupee' : `${n} rupees`;
const cap = s => s[0].toUpperCase() + s.slice(1);
const listSay = arr => arr.length < 2 ? arr.join('') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];

// Money
const MONEY = {
  c1:  { v: 1,  note: false, r: 0.40, metal: 'silver' },
  c2:  { v: 2,  note: false, r: 0.46, metal: 'silver' },
  c5:  { v: 5,  note: false, r: 0.49, metal: 'gold' },
  c10: { v: 10, note: false, r: 0.56, metal: 'bi' },
  n10: { v: 10, note: true, color: '#e3a86f', dark: '#6e3d14' },
  n20: { v: 20, note: true, color: '#cfe07a', dark: '#4d5e12' },
  n50: { v: 50, note: true, color: '#86d4e6', dark: '#155f70' },
};
const NOTE_W = 1.8, NOTE_H = 0.9;
const mkey = x => typeof x === 'string' ? x : (x >= 20 ? 'n' + x : 'c' + x);
const mval = k => MONEY[k].v;
const msize = k => MONEY[k].note ? { w: NOTE_W, h: NOTE_H } : { w: MONEY[k].r * 2, h: MONEY[k].r * 2 };
const sumMoney = keys => keys.reduce((a, k) => a + mval(k), 0);
const byValue = (a, b) => mval(b) - mval(a) || (MONEY[b].note ? 1 : 0) - (MONEY[a].note ? 1 : 0);
const moneyName = k => MONEY[k].note ? `${mval(k)} rupee note` : `${mval(k)} rupee coin`;

function greedy(amount, keys) {
  const out = [], ks = [...keys].sort(byValue);
  for (const k of ks) while (amount >= mval(k)) { out.push(k); amount -= mval(k); }
  return out;
}
function randomMoney(keys, lo, hi, minP, maxP) {
  for (let i = 0; i < 400; i++) {
    const set = Array.from({ length: rnd(minP, maxP) }, () => pick(keys));
    const s = sumMoney(set);
    if (s >= lo && s <= hi) return set.sort(byValue);
  }
  return greedy(lo, keys);
}
// Break a few big coins into smaller ones so the child has to count
function splitMoney(keys, maxPieces = 5) {
  const out = [...keys];
  const SPLIT = { c10: ['c5', 'c5'], c5: ['c2', 'c2', 'c1'], c2: ['c1', 'c1'] };
  for (let g = 0; g < 6 && out.length < maxPieces; g++) {
    const i = out.findIndex(k => SPLIT[k] && Math.random() < 0.6);
    if (i < 0) continue;
    const parts = SPLIT[out[i]];
    if (out.length - 1 + parts.length > maxPieces) break;
    out.splice(i, 1, ...parts);
  }
  return out.sort(byValue);
}
function makeOptions(ans, count, lo, hi, near = []) {
  const opts = new Set([ans]);
  for (const c of shuffle([...near, ans - 1, ans + 1, ans - 2, ans + 2])) {
    if (opts.size >= count) break;
    if (c >= lo && c <= hi) opts.add(c);
  }
  for (let guard = 0; opts.size < count && guard < 200; guard++) opts.add(rnd(lo, hi));
  return [...opts].sort((a, b) => a - b);
}
const itemByKind = kind => SHOP_ITEMS.find(i => i.kind === kind) || SHOP_ITEMS[0];
function itemFor(price, avoid = []) {
  const ok = SHOP_ITEMS.filter(i => price >= i.price[0] && price <= i.price[1] && !avoid.includes(i.kind));
  return pick(ok.length ? ok : SHOP_ITEMS.filter(i => !avoid.includes(i.kind)));
}

/* =====================================================================
   QUESTION MAKERS
   ===================================================================== */
const GEN = {
  coin(L, p = {}) {
    const key = p.value ? mkey(p.value) : pick(L.coinChoices || ['c1', 'c2', 'c5', 'c10']);
    let set = (L.coinChoices || ['c1', 'c2', 'c5', 'c10']).slice();
    if (!set.includes(key)) set[0] = key;
    const v = mval(key), what = MONEY[key].note ? 'note' : 'coin';
    return { type: 'coin', key, set: shuffle(set), text: `Tap the ₹${v} ${what}!`, sub: 'Look at the number on each one',
      say: `Can you find the ${moneyName(key)}? Tap it!` };
  },
  count(L, p = {}) {
    const money = p.money ? p.money.map(mkey).sort(byValue)
      : randomMoney(L.countMoney, L.countRange[0], L.countRange[1], L.countPieces[0], L.countPieces[1]);
    const a = sumMoney(money), hi = Math.max(L.countRange[1] + 5, a + 5);
    const near = L.countRange[1] > 10 ? [a + 5, a - 5, a + 10, a - 10] : [];
    return { type: 'count', money, a, options: makeOptions(a, L.chips || 4, 1, hi, near), money_: true,
      text: 'How much money?', sub: 'Tap each coin to count', say: 'How much money is this? Tap the coins to count them.' };
  },
  pay(L, p = {}) {
    const price = p.price ?? rnd(L.payRange[0], L.payRange[1]);
    const item = p.item ? itemByKind(p.item) : itemFor(price);
    const bonus = !!L.fewestBonus;
    return { type: 'pay', item, price, text: `Pay ₹${price}`,
      sub: bonus ? 'Tap money, then Pay · Bonus: fewest coins!' : 'Tap coins to put them on the counter, then Pay',
      say: `The ${item.name} costs ${rs(price)}. Tap the money to pay ${rs(price)}, then press Pay.` + (bonus ? ' Can you use the fewest coins and notes?' : '') };
  },
  more(L, p = {}) {
    let A, B, x, y;
    if (p.items) { [[A, x], [B, y]] = p.items; A = itemByKind(A); B = itemByKind(B); }
    else {
      const max = L.moreMax || 20;
      x = rnd(2, max);
      do { y = rnd(Math.max(1, x - 9), Math.min(max, x + 9)); } while (y === x);
      A = itemFor(x); B = itemFor(y, [A.kind]);
    }
    const big = x > y ? 0 : 1, items = [[A, x], [B, y]];
    const [BI, bp] = items[big], [, sp] = items[1 - big];
    return { type: 'more', items, a: big, text: 'Which costs more?', sub: `${cap(A.name)} ₹${x} or ${B.name} ₹${y}?`,
      say: `Which costs more? The ${A.name} for ${rs(x)}, or the ${B.name} for ${rs(y)}? Tap it!`,
      hintText: `₹${bp} is more than ₹${sp}. Tap the ${BI.name}!`,
      hintSay: `${rs(bp)} is more than ${rs(sp)}. The ${BI.name} costs more. Tap it!`,
      doneSay: `Yes! The ${BI.name} costs more.` };
  },
  canBuy(L, p = {}) {
    const max = L.moreMax || 20;
    const have = p.have ?? rnd(5, max);
    const yes = p.price !== undefined ? p.price <= have : Math.random() < 0.5;
    const price = p.price ?? (yes ? rnd(Math.max(1, have - 7), have) : rnd(have + 1, have + 7));
    const item = p.item ? itemByKind(p.item) : itemFor(price);
    const money = splitMoney(greedy(have, ['c10', 'c5', 'c2', 'c1']), 5);
    const ok = have >= price;
    return { type: 'canBuy', item, price, have, money, a: ok ? 'yes' : 'no',
      options: [{ label: 'Yes 👍', v: 'yes' }, { label: 'No 👎', v: 'no' }],
      text: 'Can you buy it?', sub: `You have ₹${have} · ${cap(item.name)} costs ₹${price}`,
      say: `You have ${rs(have)}. Can you buy the ${item.name} for ${rs(price)}?`,
      hintText: ok ? `₹${have} is enough for ₹${price} — Yes!` : `₹${have} is less than ₹${price} — No!`,
      hintSay: ok ? `${rs(have)} is ${have === price ? 'just' : 'more than'} enough for ${rs(price)}. Yes, you can buy it!`
                  : `${rs(have)} is less than ${rs(price)}. No, not enough money.`,
      doneSay: ok ? `Yes! You can buy the ${item.name}.` : `That's right! We need more money for the ${item.name}.` };
  },
  change(L, p = {}) {
    const paid = p.paid ?? pick(L.changeFrom || [10, 20]);
    let change, price;
    if (p.price !== undefined) { price = p.price; change = paid - price; }
    else { change = rnd(1, Math.min(paid - 1, paid === 20 ? 15 : 20)); price = paid - change; }
    const item = p.item ? itemByKind(p.item) : itemFor(price);

function fitModel(model, maxW, maxH) {
  const box = new THREE.Box3().setFromObject(model), size = box.getSize(new V3()), c = box.getCenter(new V3());

/* =====================================================================
   SCREEN FIT
   ===================================================================== */
const TAN = Math.tan(THREE.MathUtils.degToRad(25));
const view = { w: 16, h: 9, dist: 10 };
const halfH = z => TAN * (view.dist - z);
const depthF = z => (view.dist - z) / view.dist;
let counterY = -2;

function layout() {
  const aspect = window.innerWidth / window.innerHeight;
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = aspect;
  view.dist = Math.max(9 / (2 * TAN), 7 / (2 * TAN * aspect));
  view.h = 2 * TAN * view.dist; view.w = view.h * aspect;
  camera.position.set(0, 0, view.dist); camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
  const bh = halfH(-6), bs = Math.max(2 * bh * aspect / 30, 2 * bh / 18) * 1.02;
  backdrop.position.set(0, 0, -6); backdrop.scale.setScalar(bs);
  const ah = halfH(-1.5), as = Math.max(0.75, ah / 6);
  awning.position.set(0, ah - 1.05 * as, -1.5); awning.scale.setScalar(as);
  arrange();
}

const pxToY = px => view.h / 2 - (px / window.innerHeight) * view.h;
function zones() {
  const card = $('qcard'), bot = $('bottom');
  const topPx = card.classList.contains('hidden') ? 70 : card.offsetTop + card.offsetHeight + 10;
  const botPx = bot.offsetHeight > 0 ? bot.offsetTop - 10 : window.innerHeight - 14;
  return { top: pxToY(topPx), bottom: pxToY(botPx) };
}
function setCounter(y) {
  counterY = y;
  const f = depthF(-1), top = y * f, bottom = -halfH(-1) - 1;
  counter.position.set(0, 0, -1);
  counterFront.top.position.y = top - 0.15;
  counterFront.strip.position.y = top - 0.55;
  const h = Math.max(0.5, top - 0.3 - bottom);
  counterFront.front.scale.y = h; counterFront.front.position.y = top - 0.3 - h / 2;
  counterFront.front.material.map.repeat.set(18, 1);
}
function place(m, x, y, s, z = m.z || 0) {
  const f = depthF(z);
  m.tp.set(x * f, y * f, z); m.ts = s * f;
}

/* ---------- arrange the question's blocks on screen ---------- */
let blocks = [];
const GAP = 0.4, SMAX = 1.35, SMAX_SIDE = 1.75;
function arrange() {
  const Z = zones(), M = 0.3;
  const W = view.w - 2 * M, H = Z.top - Z.bottom;
  if (!blocks.length) {   // menu / end screen / number question: just the shopkeeper
    keeperM.g.visible = true;
    if (view.w / view.h < 1) {
      const s = Math.min(1.3, view.h * 0.2 / KEEPER.h), cy = game.playing ? Z.bottom + (Z.top - Z.bottom) * 0.35 : -view.h / 2 + view.h * 0.05;
      place(keeperM, 0, cy + KEEPER.h * s / 2, s); setCounter(cy);
    } else {
      const s = Math.min(1.4, view.h * 0.42 / KEEPER.h), cy = game.playing ? (Z.top + Z.bottom) / 2 - KEEPER.h * s / 2 : -view.h * 0.22;
      place(keeperM, game.playing ? 0 : view.w * 0.34, cy + KEEPER.h * s / 2, s); setCounter(cy);
    }
    relayoutLoose();
    return;
  }
  const stack = W / H < 1.3;
  if (stack) {
    const rows = [blocks.filter(b => !b.low), blocks.filter(b => b.low)].filter(r => r.length).map(r => {
      const w = r.reduce((a, b) => a + b.w, 0) + GAP * (r.length - 1), h = Math.max(...r.map(b => b.h));
      return { r, w, h, s: Math.min(SMAX, W / w) };
    });
    let total = rows.reduce((a, R) => a + R.h * R.s, 0) + GAP * (rows.length - 1);
    if (total > H) { const f = H / total; rows.forEach(R => R.s *= f); total = H; }
    const spare = H - total - GAP * 0.5;
    let ks = Math.min(1.15, spare / KEEPER.h);
    const showK = ks >= 0.45;
    let free = spare - (showK ? KEEPER.h * ks : 0);
    let y = Z.top - free * 0.2;
    if (showK) {
      keeperM.g.visible = true;
      place(keeperM, 0, y - KEEPER.h * ks / 2, ks);
      y -= KEEPER.h * ks; setCounter(y);
      y -= GAP * 0.5;
    } else { keeperM.g.visible = false; place(keeperM, 0, view.h, 0.01); setCounter(Z.top + 0.2); }
    const g2 = (free * 0.8) / (rows.length + 1);
    y -= g2;
    for (const R of rows) {
      const rh = R.h * R.s;
      let x = -R.w * R.s / 2;
      for (const b of R.r) { place(b, x + b.w * R.s / 2, y - rh / 2, R.s); x += (b.w + GAP) * R.s; }
      y -= rh + GAP + g2;
    }
  } else {
    const rw = blocks.reduce((a, b) => a + b.w, 0) + GAP * (blocks.length - 1), rh = Math.max(...blocks.map(b => b.h));
    const topLimit = pxToY(64);
    let ks = 1, s = 1, cy = 0;
    for (let it = 0; it < 3; it++) {
      s = Math.min(SMAX_SIDE, (W - KEEPER.w * ks - GAP) / rw, H / rh);
      cy = (Z.top + Z.bottom) / 2;
      counterY = cy - 0.5 * s;
      ks = Math.max(0.4, Math.min(1.2, (topLimit - counterY) / KEEPER.h));
    }
    keeperM.g.visible = true;
    const left = -view.w / 2 + M;
    place(keeperM, left + KEEPER.w * ks / 2, counterY + KEEPER.h * ks / 2, ks);
    setCounter(counterY);
    const regionL = left + KEEPER.w * ks + GAP, regionR = view.w / 2 - M;
    let x = Math.max(regionL, Math.min(-rw * s / 2, regionR - rw * s));
    if (x + rw * s > regionR) x = (regionL + regionR - rw * s) / 2;
    for (const b of blocks) { place(b, x + b.w * s / 2, cy, s); x += (b.w + GAP) * s; }
  }
  relayoutLoose();
}

/* =====================================================================
   QUESTION BLOCKS
   ===================================================================== */
let tappables = [];
function tappable(meshObj, fn) { meshObj.userData.onTap = fn; tappables.push(meshObj); }
function untap(meshObj) { tappables = tappables.filter(t => t !== meshObj); }

function mkBlock(role, w, h, opts = {}) {
  const b = mover(play, { role, w, h, low: !!opts.low, z: 0, top: true });
  blocks.push(b);
  return b;
}
// flow-layout a list of money, centred on (0,0)
function flow(keys, maxW, gap = 0.2) {
  const rows = []; let cur = [], cw = 0;
  keys.forEach((k, i) => { const { w } = msize(k); if (cur.length && cw + gap + w > maxW) { rows.push(cur); cur = []; cw = 0; } cw += (cur.length ? gap : 0) + w; cur.push(i); });
  if (cur.length) rows.push(cur);
  const rowH = r => Math.max(...r.map(i => msize(keys[i]).h));
  const H = rows.reduce((a, r) => a + rowH(r), 0) + gap * (rows.length - 1);
  const pos = []; let y = H / 2, W = 0;
  rows.forEach(r => {
    const h = rowH(r), rw = r.reduce((a, i) => a + msize(keys[i]).w, 0) + gap * (r.length - 1);
    W = Math.max(W, rw); let x = -rw / 2;
    r.forEach(i => { const w = msize(keys[i]).w; pos[i] = { x: x + w / 2, y: y - h / 2 }; x += w + gap; });
    y -= h + gap;
  });
  return { pos, w: W, h: H };
}

function itemBlock(item, price) {
  const b = mkBlock('item', 2.3, 2.5);
  const { wrap } = fitModel(BUILD[item.kind](), 1.75, 1.7);
  const sway = new THREE.Group(); sway.add(wrap); sway.position.set(-0.05, 0.3, 0.1); b.inner.add(sway);
  const shadow = mesh(new THREE.CircleGeometry(0.85, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.13, depthWrite: false }), 0, -0.62, -0.6);
  shadow.scale.y = 0.25; b.inner.add(shadow);
  const tag = priceTag(price); tag.position.set(0.5, -0.82, 0.7); tag.rotation.z = -0.08; b.inner.add(tag);
  const hit = mesh(new THREE.PlaneGeometry(2.3, 2.6), hitMat, 0, 0, 0.9); b.inner.add(hit);
  Object.assign(b, { sway, model: wrap.children[0], item, price, hit, phase: Math.random() * 6 });
  return b;
}
function moneyBlock(keys, { maxW = 5, gap = 0.3, title = null, low = false, role = 'money' } = {}) {
  const f = flow(keys, maxW, gap), T = title ? 0.62 : 0;
  const w = Math.max(f.w + 0.7, title ? 2.8 : 0), h = f.h + 0.7 + T;
  const b = mkBlock(role, w, h, { low });
  const mat = matMesh(w, h, { fill: '#fff6dc', stroke: '#e9b949' }); mat.position.z = -0.3; b.inner.add(mat);
  if (title) { const l = label(title, { size: 0.44, bg: '#ffd166' }); l.position.set(0, h / 2 - 0.36, -0.2); b.inner.add(l); }
  b.coins = keys.map((k, i) => {
    const c = moneyMover(b.inner, k);
    c.tp.set(f.pos[i].x, f.pos[i].y - T / 2, 0); c.g.position.copy(c.tp); c.ts = 1;
    c.sv = 0; c.s = 0.001; c.delay = i * 0.07;
    return c;
  });
  return b;
}
function paySpot() {
  const b = mkBlock('pay', 4.4, 3.0);
  const mat = matMesh(4.4, 3.0, { fill: '#fffaf0', stroke: '#f4a261', dash: true }); mat.position.z = -0.3; b.inner.add(mat);
  const l = label('Put money here', { size: 0.42, bg: null, color: '#d17a22' }); l.position.z = -0.25; l.material.opacity = 0.75; b.inner.add(l);
  b.hintLabel = l;
  return b;
}
function trayBlock(keys) {
  const coins = keys.filter(k => !MONEY[k].note), notes = keys.filter(k => MONEY[k].note);
  const CW = 1.42, CH = 1.42, NW = 2.12, NH = 1.25, PAD = 0.3, T = 0.62;
  const rows = [coins, notes].filter(r => r.length);
  const isNote = r => MONEY[r[0]].note;
  const w = Math.max(...rows.map(r => r.length * (isNote(r) ? NW : CW))) + PAD * 2;
  const h = rows.reduce((a, r) => a + (isNote(r) ? NH : CH), 0) + PAD * 2 + T;
  const b = mkBlock('tray', w, h, { low: true });
  const mat = matMesh(w, h, { fill: '#4f8fd8', stroke: '#2f6db5', pattern: 'felt' }); mat.position.z = -0.3; b.inner.add(mat);
  const l = label('Your money — tap to pay', { size: 0.42, bg: '#ffd166' }); l.position.set(0, h / 2 - 0.38, -0.2); b.inner.add(l);
  b.stacks = [];
  let y = h / 2 - PAD - T;
  for (const r of rows) {
    const cw = isNote(r) ? NW : CW, ch = isNote(r) ? NH : CH;
    r.forEach((k, i) => {
      const st = mover(b.inner, { key: k, value: mval(k) });
      for (let j = 2; j >= 0; j--) { const v = moneyVisual(k, false); v.position.set(-0.04 * j, -0.07 * j, -0.05 * j); if (MONEY[k].note) v.rotation.z += (j - 1) * 0.06; st.inner.add(v); }
      st.hit = mesh(new THREE.PlaneGeometry(cw - 0.06, ch - 0.06), hitMat, 0, 0, 0.3); st.inner.add(st.hit);
      st.tp.set((i - (r.length - 1) / 2) * cw, y - ch / 2, 0); st.g.position.copy(st.tp); st.ts = 1; st.delay = 0.1 + i * 0.06;
      tappable(st.hit, () => trayTap(st));
      b.stacks.push(st);
    });
    y -= ch;
  }
  return b;
}

/* ---------- loose money (paid coins, change) ---------- */
const pay = { list: [], spot: null, tray: null, price: 0 };
let changeCoins = [];
function blockToWorld(b, x, y) { return new V3(b.tp.x + x * b.ts, b.tp.y + y * b.ts, 0); }
function relayoutLoose() {
  const B = pay.spot;
  if (B) {
    const list = [...pay.list].sort((a, b) => byValue(a.key, b.key));
    const iw = B.w - 0.45, ih = B.h - 0.4;
    for (const k of [1, 0.86, 0.74, 0.64, 0.56, 0.48, 0.42]) {
      const f = flow(list.map(e => e.key), iw / k, 0.14);
      if (f.h * k <= ih || k === 0.42) {
        list.forEach((e, i) => { const p = blockToWorld(B, f.pos[i].x * k, f.pos[i].y * k); e.tp.set(p.x, p.y, 0.35 + i * 0.012); e.ts = B.ts * k; });
        break;
      }
    }
    B.hintLabel.visible = pay.list.length === 0;
  }
  if (changeCoins.length) {
    const Z = zones(), f = flow(changeCoins.map(c => c.key), view.w * 0.8, 0.2);
    changeCoins.forEach((c, i) => { c.tp.set(f.pos[i].x * 1.2, Z.bottom + 0.9 + f.pos[i].y, 1.2); c.ts = 1.2; });
  }
}
function stackWorld(st) { const T = pay.tray; return blockToWorld(T, st.tp.x, st.tp.y); }
function addPaid(key, glow = false) {
  const st = pay.tray.stacks.find(s => s.key === key);
  const e = moneyMover(play, key);
  e.top = true;
  const p = stackWorld(st); e.g.position.set(p.x, p.y, 0.6); e.s = pay.tray.ts; e.g.scale.setScalar(e.s);
  pay.list.push(e);
  tappable(e.hit, () => paidTap(e));
  e.hit.userData.busy = () => e.g.position.distanceTo(e.tp) > 0.35; // still flying: taps go to what is behind it
  if (glow) halo(e.inner, MONEY[key].note ? 0.7 : MONEY[key].r, -0.08);
  st.hop = 1;
  relayoutLoose(); updateTotal();
  MONEY[key].note ? sfx.swish() : sfx.clink();
  return e;
}
function returnPaid(e) {
  pay.list = pay.list.filter(x => x !== e); untap(e.hit);
  const st = pay.tray.stacks.find(s => s.key === e.key), p = stackWorld(st);
  e.tp.set(p.x, p.y, 0.6); e.dieIn = 0.18;
}
function updateTotal() {
  const t = sumMoney(pay.list.map(e => e.key));
  $('total').innerHTML = `<b>₹${t}</b>&nbsp;of ₹${pay.price}`;
  return t;
}

/* =====================================================================
   GAME
   ===================================================================== */
const game = { playing: false, levelKey: null, L: null, qi: 0, firstTry: 0, attempts: 0, q: null, busy: false, recent: [], countSum: 0 };
let nextTimer = null, timers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };

function setCard(q) {
  const card = $('qcard');
  $('qtext').textContent = q.text;
  setSub(q.sub || '');
  card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
}
function setSub(text, hint = false) { const s = $('qsub'); s.textContent = text; s.classList.toggle('hinting', hint); }
function updateHud(bump) {
  $('starCount').textContent = game.firstTry;
  $('qnum').textContent = `${Math.min(game.qi + 1, QUESTIONS_PER_ROUND)} / ${QUESTIONS_PER_ROUND}`;
  if (bump) { const s = $('starCount'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
}
function toast(text, kind = '') {
  const t = $('toast');
  t.textContent = text; t.className = kind; void t.offsetWidth; t.className = `${kind} show`;
}
function showChips(opts) {
  const box = $('answers'); box.innerHTML = '';
  if (!opts) { box.classList.add('hidden'); return; }
  for (const o of opts) {
    const b = document.createElement('button');
    b.className = 'ans'; b.textContent = o.label; b.dataset.v = String(o.v);
    b.onclick = () => chipTap(b, o.v);
    box.appendChild(b);
  }
  box.classList.remove('hidden');
}

function clearQuestion() {
  clearTimeout(nextTimer); timers.forEach(clearTimeout); timers = [];
  for (const m of movers) if (m.top) m.dying = true;
  tappables = []; blocks = []; changeCoins = [];
  Object.assign(pay, { list: [], spot: null, tray: null, price: 0 });
  showChips(null);
  $('paybar').classList.add('hidden'); $('payBtn').classList.remove('pulse');
}

function startGame(key) {
  audio();
  clearDeco();
  Object.assign(game, { playing: true, levelKey: key, L: LEVELS[key], qi: 0, firstTry: 0, recent: [] });
  $('startScreen').classList.add('hidden'); $('endScreen').classList.add('hidden');
  ['qcard', 'stats', 'homeBtn'].forEach(id => $(id).classList.remove('hidden'));
  nextQuestion();
}

function nextQuestion() {
  clearQuestion();
  if (game.qi >= QUESTIONS_PER_ROUND) return endGame();
  const q = makeQuestion(game.L, game.recent);
  game.recent.push(q.text + q.sub); if (game.recent.length > 4) game.recent.shift();
  Object.assign(game, { q, attempts: 0, busy: false, countSum: 0 });
  setCard(q); updateHud();
  buildQuestion(q);
  arrange();
  // new blocks start where they are, popping in
  for (const b of blocks) { b.g.position.copy(b.tp); }
  say(q.say);
}

function buildQuestion(q) {
  switch (q.type) {
    case 'coin': {
      const b = moneyBlock(q.set, { maxW: 6, gap: 0.5 });
      b.coins.forEach(c => tappable(c.hit, () => coinTap(c)));
      break;
    }
    case 'count': {
      const b = moneyBlock(q.money, { maxW: 4.6, gap: 0.42 });
      b.coins.forEach(c => tappable(c.hit, () => countTap(c)));
      showChips(q.options.map(v => ({ label: `₹${v}`, v })));
      break;
    }
    case 'pay': {
      const A = itemBlock(q.item, q.price);
      pay.spot = paySpot(); pay.tray = trayBlock(game.L.tray || ['c1', 'c2', 'c5', 'c10']); pay.price = q.price;
      A.g.visible = true; updateTotal();
      $('paybar').classList.remove('hidden');
      break;
    }
    case 'more': {
      q.items.forEach(([item, price], i) => { const b = itemBlock(item, price); tappable(b.hit, () => itemTap(b, i)); });
      break;
    }
    case 'canBuy': {
      itemBlock(q.item, q.price);
      moneyBlock(q.money, { maxW: 4.2, gap: 0.25, title: 'Your money', low: true, role: 'purse' });
      showChips(q.options);
      break;
    }
    case 'change': {
      itemBlock(q.item, q.price);
      moneyBlock(q.paidMoney, { maxW: 4, title: 'You pay', role: 'paid' });
      showChips(q.options.map(v => ({ label: `₹${v}`, v })));
      break;
    }
    default: showChips(q.options.map(v => ({ label: String(v), v })));
  }
}

function win(msg, sayExtra = '', delay = 1600) {
  game.busy = true;
  if (game.attempts === 0) game.firstTry++;
  game.qi++;
  updateHud(game.attempts === 0);
  keeperMood('happy');
  const praise = game.attempts === 0 ? pick(PRAISE) : 'Good! You did it!';
  toast(msg || praise); say((msg || praise) + ' ' + sayExtra);
  nextTimer = setTimeout(nextQuestion, delay);
}
function sparkle(pos, n = 30) { burst(pos, n); }

/* ---------- coin recognition ---------- */
function coinTap(c) {
  if (game.busy) return;
  const q = game.q;
  if (c.key === q.key) {
    untap(c.hit); c.spin = 12; c.ts = 1.4; c.hop = 1;
    sfx.clink(); sfx.correct(); sparkle(c.g.getWorldPosition(new V3()));
    blocks[0].coins.forEach(o => { if (o !== c) o.ts = 0.7; });
    win(null, `That's the ${moneyName(q.key)}!`);
  } else {
    game.attempts++;
    c.shake = 1; c.ts = 0.75; untap(c.hit);
    sfx.wrong(); keeperMood('hmm');
    const left = blocks[0].coins.filter(o => tappables.includes(o.hit)).length;
    if (game.attempts === 1 && left > 1) { toast('Oops! Try again 🙂', 'soft'); say(`Oops! That one is ${rs(c.value)}. Try again!`); }
    else showCoinHint();
  }
}
function showCoinHint() {
  const q = game.q, right = blocks[0].coins.find(o => o.key === q.key);
  halo(right.inner, MONEY[q.key].note ? 0.7 : MONEY[q.key].r);
  setSub(`This is the ₹${mval(q.key)} ${MONEY[q.key].note ? 'note' : 'coin'} — tap it!`, true);
  say(`Look! This is the ${moneyName(q.key)}. Tap it!`);
}

/* ---------- count the money ---------- */
function countTap(c, auto = false) {
  if (game.busy && !auto) return;
  c.hop = 1;
  if (c.counted) { sfx.tick(0); return; }
  c.counted = true; game.countSum += c.value;
  const l = label(`₹${game.countSum}`, { size: 0.46, bg: '#ffd166', border: '#e09f3e' });
  l.position.set(0, (MONEY[c.key].note ? 0.45 : MONEY[c.key].r) + 0.22, 0.4); c.inner.add(l);
  sfx.tick(blocks[0].coins.filter(o => o.counted).length);
  if (!auto) say(String(game.countSum));
}
function autoCount(done) {
  const coins = blocks[0].coins.filter(c => !c.counted);
  coins.forEach((c, i) => later(() => countTap(c, true), 200 + i * 450));
  later(done, 300 + coins.length * 450);
}

/* ---------- answer chips (count, can I buy, change) ---------- */
function chipTap(btn, v) {
  if (game.busy || btn.disabled) return;
  const q = game.q;
  if (String(v) === String(q.a)) {
    btn.classList.remove('hint'); btn.classList.add('right');
    sfx.correct();
    if (q.type === 'count') { blocks[0].coins.forEach(c => c.hop = 1); win(null, `It's ${rs(q.a)}.`); }
    else if (q.type === 'canBuy') {
      if (q.a === 'yes') {
        sfx.chaching();
        const item = blocks.find(b => b.role === 'item'), purse = blocks.find(b => b.role === 'purse');
        slideToChild(item);
        purse.coins.forEach((c, i) => { c.tp.set(c.tp.x + 3, c.tp.y + 6, 0); c.ts = 0.3; c.delay = i * 0.06; });
      }
      win(null, q.doneSay, 2000);
    } else if (q.type === 'change') {
      sfx.chaching();
      const hand = keeperHand();
      changeCoins = q.change.map((k, i) => { const c = moneyMover(play, k); c.top = true; c.g.position.copy(hand); c.s = 0.3; c.delay = 0.15 + i * 0.12; return c; });
      relayoutLoose();
      win(null, q.doneSay, 2600);
    } else win(null, '');
  } else {
    game.attempts++;
    btn.classList.add('wrong'); btn.disabled = true;
    sfx.wrong(); keeperMood('hmm');
    const left = [...$('answers').children].filter(b => !b.disabled).length;
    if (game.attempts === 1 && left > 1) {
      toast('Oops! Try again 🙂', 'soft');
      say(q.type === 'count' ? 'Oops! Try again. Tap the coins to count them.' : 'Oops! Try again.');
    } else showChipHint();
  }
}
function showChipHint() {
  const q = game.q;
  const right = [...$('answers').children].find(b => b.dataset.v === String(q.a));
  const mark = () => { right?.classList.add('hint'); };
  if (q.type === 'count') {
    game.busy = true;
    setSub("Let's count together!", true); say("Let's count together!");
    autoCount(() => { game.busy = false; mark(); setSub(`It's ₹${q.a} — tap ₹${q.a}!`, true); say(`It's ${rs(q.a)}. Tap ${q.a}!`); });
  } else {
    mark(); setSub(q.hintText || `The answer is ${q.a}`, true); say(q.hintSay || `The answer is ${q.a}.`);
  }
}

/* ---------- which costs more ---------- */
function itemTap(b, i) {
  if (game.busy) return;
  const q = game.q;
  if (i === q.a) {
    b.hop = 1; b.ts *= 1.12; sfx.correct(); sparkle(b.g.getWorldPosition(new V3()));
    blocks.forEach(o => { if (o !== b) o.ts *= 0.8; });
    win(null, q.doneSay);
  } else {
    game.attempts++;
    b.shake = 1; sfx.wrong(); keeperMood('hmm');
    const right = blocks[q.a];
    if (!right.haloed) { halo(right.inner, 0.95, -0.6).position.y = 0.3; right.haloed = true; }
    setSub(q.hintText, true); say(q.hintSay);
  }
}

/* ---------- pay exactly ---------- */
function trayTap(st) {
  if (game.busy) return;
  if (pay.list.length >= 24) { toast('Counter is full!', 'soft'); say('The counter is full! Tap a coin on the counter to take it back.'); return; }
  $('payBtn').classList.remove('pulse');
  addPaid(st.key);
  say(rs(updateTotal()));
}
function paidTap(e) {
  if (game.busy) return;
  returnPaid(e); relayoutLoose();
  say(rs(updateTotal())); sfx.clinkBack();
}
function payPress() {
  if (game.busy || game.q?.type !== 'pay') return;
  const price = pay.price, total = updateTotal();
  if (total === 0) { toast('Tap the coins! 👇', 'soft'); say('First tap your coins to put money on the counter.'); return; }
  if (total === price) return paySuccess();
  game.attempts++;
  sfx.wrong(); keeperMood('hmm');
  if (game.attempts === 1) {
    const d = Math.abs(total - price);
    const msg = total > price ? `That's ₹${total} — too much! Take ₹${d} back.` : `That's ₹${total} — not enough. Add ₹${d} more.`;
    toast('Oops! Try again 🙂', 'soft'); setSub(msg, true); say(msg);
  } else showPayHint();
}
function showPayHint() {
  game.busy = true;
  [...pay.list].forEach(returnPaid); relayoutLoose(); updateTotal();
  const set = greedy(pay.price, pay.tray.stacks.map(s => s.key));
  set.forEach((k, i) => later(() => { addPaid(k, true); }, 450 + i * 300));
  const parts = set.map(k => `₹${mval(k)}`);
  setSub(`${parts.join(' + ')} = ₹${pay.price} · Now press Pay!`, true);
  say(`Look! ${listSay(set.map(k => rs(mval(k))))} make ${rs(pay.price)}. Now press Pay!`);
  later(() => { game.busy = false; $('payBtn').classList.add('pulse'); }, 500 + set.length * 300);
}
function paySuccess() {
  game.busy = true;
  $('payBtn').classList.remove('pulse');
  sfx.chaching();
  const hand = keeperHand();
  pay.list.forEach((e, i) => { untap(e.hit); e.tp.copy(hand); e.ts *= 0.35; e.dieIn = 0.45 + i * 0.03; e.speed = 7; });
  sparkle(blockToWorld(pay.spot, 0, 0), 36);
  const item = blocks.find(b => b.role === 'item');
  slideToChild(item);
  const fewest = game.L.fewestBonus && pay.list.length === greedy(pay.price, pay.tray.stacks.map(s => s.key)).length;
  const name = game.q.item.name;
  if (fewest) { setSub('🌟 Fewest coins — super smart!', true); win(`Fewest coins! 🌟`, `You used the fewest coins! The ${name} is yours!`, 2300); }
  else win(null, `The ${name} is yours!`, 2200);
  pay.list = [];
}
function slideToChild(b) {
  if (!b) return;
  const Z = zones();
  b.tp.set(0, Z.bottom + 1.3, 2.5); b.ts *= 1.15; b.speed = 4; b.dieIn = 1.5;
}

function endGame() {
  game.playing = false;
  clearQuestion();
  ['qcard', 'stats'].forEach(id => $(id).classList.add('hidden'));
  const s = game.firstTry, N = QUESTIONS_PER_ROUND;
  const stars = s >= Math.ceil(N * 0.9) ? 3 : s >= Math.ceil(N * 0.6) ? 2 : 1;
  $('bigstars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'dim'}">⭐</span>`).join('');
  $('endmsg').textContent = `${s} out of ${N} right on the first try!`;
  const key = `mm-best-${game.levelKey}`, best = Number(store.get(key) || 0);
  $('newbest').classList.toggle('hidden', !(s > best));
  if (s > best) store.set(key, String(s));
  $('endScreen').classList.remove('hidden');
  arrange(); keeperMood('happy'); keeper.moodT = 3;
  sfx.fanfare();
  say(`You got ${s} out of ${N}! ${stars === 3 ? 'Amazing shopping!' : stars === 2 ? 'Great shopping!' : 'Good try! Let\'s shop again!'}`);
  for (let i = 0; i < 4; i++) setTimeout(() => burst(new V3((Math.random() - 0.5) * view.w * 0.7, (Math.random() - 0.2) * view.h * 0.4, 0.5), 40), i * 250);
}

function goHome() {
  game.playing = false; clearQuestion();
  if (hasSpeech) speechSynthesis.cancel();
  ['qcard', 'stats', 'homeBtn'].forEach(id => $(id).classList.add('hidden'));
  $('endScreen').classList.add('hidden');
  buildLevelButtons();
  $('startScreen').classList.remove('hidden');
  arrange();
}

function buildLevelButtons() {
  const box = $('levels'); box.innerHTML = '';
  for (const [key, L] of Object.entries(LEVELS)) {
    const best = Number(store.get(`mm-best-${key}`) || 0);
    const st = best >= Math.ceil(QUESTIONS_PER_ROUND * 0.9) ? 3 : best >= Math.ceil(QUESTIONS_PER_ROUND * 0.6) ? 2 : best > 0 ? 1 : 0;
    const btn = document.createElement('button');
    btn.className = 'lvl'; btn.style.background = L.color;
    btn.innerHTML = `<span><b>${L.emoji} ${L.name}</b><small>${L.blurb}</small></span>
      <span class="best">${[0, 1, 2].map(i => `<span class="${i < st ? '' : 'dim'}">⭐</span>`).join('')}</span>`;
    btn.onclick = () => startGame(key);
    box.appendChild(btn);
  }
}

$('homeBtn').onclick = goHome;
$('againBtn').onclick = () => startGame(game.levelKey);
$('levelBtn').onclick = goHome;
$('qcard').onclick = () => game.q && game.playing && say(game.q.say);
$('payBtn').onclick = payPress;

/* ---------- tap / click ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  audio();
  if (!game.playing) return;
  ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(tappables, false).find(h => !h.object.userData.busy?.());
  if (hit) hit.object.userData.onTap();
});

/* ---------- sparkles & confetti ---------- */
const confGeo = new THREE.PlaneGeometry(0.14, 0.24), starGeo = new THREE.OctahedronGeometry(0.1);
const CONF = [0xff4d6d, 0xffb703, 0x4cc9f0, 0x8ac926, 0xb5179e, 0xfb8500, 0x3a86ff];
const particles = [];
function burst(pos, n) {
  for (let i = 0; i < n; i++) {
    const gold = i % 3 === 0;
    const m = new THREE.Mesh(gold ? starGeo : confGeo, new THREE.MeshBasicMaterial({ color: gold ? 0xffd60a : pick(CONF), side: THREE.DoubleSide, transparent: true }));
    m.position.copy(pos); m.position.z += 1;
    const a = Math.random() * Math.PI * 2, s = 2.5 + Math.random() * 4;
    particles.push({ m, life: 1.4, max: 1.4, v: new V3(Math.cos(a) * s, Math.sin(a) * s + 3, (Math.random() - 0.5) * 2),
      spin: new V3(Math.random() * 9, Math.random() * 9, Math.random() * 9) });
    scene.add(m);
  }
}

/* ---------- falling coins on the menu ---------- */
let deco = [], decoTimer = 0;
function clearDeco() { deco.forEach(d => scene.remove(d.g)); deco = []; }

/* =====================================================================
   ANIMATION LOOP
   ===================================================================== */
const clock = new THREE.Clock();
function inScene(o) { while (o.parent) o = o.parent; return o === scene; }
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  // menu: coins rain gently
  if (!game.playing) {
    decoTimer -= dt;
    if (decoTimer <= 0 && deco.length < 12) {
      decoTimer = 0.55;
      const g = moneyVisual(pick(['c1', 'c2', 'c5', 'c10', 'c10', 'n20']), false), s = 0.8 + Math.random() * 0.6;
      g.scale.setScalar(s); g.position.set((Math.random() - 0.5) * view.w * 0.95, view.h / 2 + 1, -0.5 + Math.random());
      scene.add(g); deco.push({ g, vy: 1.1 + Math.random() * 1.1, spin: 1.5 + Math.random() * 2.5 });
    }
  }
  for (let i = deco.length - 1; i >= 0; i--) {
    const d = deco[i]; d.g.position.y -= d.vy * dt; d.g.rotation.y += d.spin * dt;
    if (d.g.position.y < -view.h / 2 - 1.5) { scene.remove(d.g); deco.splice(i, 1); }
  }

  // everything that moves
  let anyDead = false;
  for (const m of movers) {
    if (m.dead) { anyDead = true; continue; }
    if (m.delay > 0) { m.delay -= dt; m.g.scale.setScalar(0.0001); continue; }
    if (m.dieIn > 0) { m.dieIn -= dt; if (m.dieIn <= 0) m.dying = true; }
    const k = 1 - Math.exp(-dt * m.speed);
    m.g.position.lerp(m.tp, k);
    const target = m.dying ? 0 : m.ts;
    m.sv += (target - m.s) * 190 * dt; m.sv *= Math.exp(-dt * 15); m.s += m.sv * dt;
    if (m.dying && m.s < 0.03) {
      m.dead = true; anyDead = true;
      m.g.parent?.remove(m.g);
      m.g.traverse(o => { if (o.userData.mover) o.userData.mover.dead = true; });
      disposeTree(m.g);
      continue;
    }
    m.g.scale.setScalar(Math.max(0.0001, m.s));
    m.hop = Math.max(0, m.hop - dt * 3); m.shake = Math.max(0, m.shake - dt * 1.8);
    m.inner.position.set(Math.sin(t * 40) * 0.12 * m.shake, Math.sin(m.hop * Math.PI) * 0.35, 0);
    if (m.spin) m.inner.rotation.y += m.spin * dt;
    if (m.tilt) m.tilt.rotation.y = 0.14 + Math.sin(t * 1.4 + m.phase) * 0.12;
    if (m.sway) { m.sway.rotation.y = Math.sin(t * 1.2 + m.phase) * 0.25; m.sway.position.y = 0.3 + Math.sin(t * 2 + m.phase) * 0.04;
      const sp = m.model?.userData?.spinner; if (sp) sp.rotation.y += dt * 0.8; }
  }
  if (anyDead) movers = movers.filter(m => !m.dead);

  // hint halos pulse
  for (let i = halos.length - 1; i >= 0; i--) {
    const h = halos[i];
    if (!inScene(h)) { halos.splice(i, 1); continue; }
    const k = 0.5 + 0.5 * Math.sin(t * 7);
    h.scale.setScalar(1 + 0.12 * k); h.material.opacity = 0.45 + 0.5 * k;
  }

  // shopkeeper
  const K = keeper;
  K.moodT = Math.max(0, K.moodT - dt);
  const happy = K.mood === 'happy' && K.moodT > 0, hmm = K.mood === 'hmm' && K.moodT > 0;
  K.body.position.y = Math.sin(t * 2) * 0.04 + (happy ? Math.abs(Math.sin(t * 9)) * 0.22 : 0);
  K.head.rotation.z = Math.sin(t * 1.3) * 0.05 + (hmm ? 0.22 : 0);
  K.head.rotation.x = hmm ? 0.12 : 0;
  K.blink -= dt; const closed = K.blink < 0.12; if (K.blink < 0) K.blink = 2 + Math.random() * 3;
  K.eyes.forEach(e => e.scale.y = closed ? 0.12 : 1);
  const R = K.arms[1], Lr = K.arms[0];
  const wave = happy || !game.playing;
  R.rotation.x += ((wave ? 0 : -0.9) - R.rotation.x) * Math.min(1, dt * 8);
  R.rotation.z += ((wave ? 2.5 + Math.sin(t * 12) * 0.35 : 0.18) - R.rotation.z) * Math.min(1, dt * 8);
  Lr.rotation.z += ((happy ? -2.3 + Math.sin(t * 12 + 1) * 0.3 : -0.18) - Lr.rotation.z) * Math.min(1, dt * 8);
  Lr.rotation.x += ((happy ? 0 : -0.9) - Lr.rotation.x) * Math.min(1, dt * 8);

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); particles.splice(i, 1); continue; }
    p.v.y -= 9 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.x += p.spin.x * dt; p.m.rotation.y += p.spin.y * dt; p.m.rotation.z += p.spin.z * dt;
    p.m.material.opacity = Math.min(1, (p.life / p.max) * 2);
  }

  renderer.render(scene, camera);
});

window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { if (document.hidden && hasSpeech) speechSynthesis.cancel(); });
buildLevelButtons();
layout();

// for testing only
const scr = o => { const v = o.getWorldPosition(new V3()).project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight }; };
window.__test = {
  game, camera, scene, play, pay,
  state() {
    const q = game.q || {};
    return { playing: game.playing, type: q.type, a: q.a, key: q.key, price: q.price, total: pay.list.length ? sumMoney(pay.list.map(e => e.key)) : 0,
      qi: game.qi, firstTry: game.firstTry, attempts: game.attempts, busy: game.busy, sub: $('qsub').textContent, text: q.text,
      playChildren: play.children.length, movers: movers.length, tappables: tappables.length };
  },
  targets() {
    const out = { tray: [], paid: [], coins: [], items: [], chips: [], pay: null };
    if (pay.tray) pay.tray.stacks.forEach(s => out.tray.push({ key: s.key, value: s.value, ...scr(s.hit) }));
    pay.list.forEach(e => out.paid.push({ key: e.key, value: e.value, ...scr(e.hit) }));
    blocks.forEach((b, i) => {
      if (b.coins && (game.q.type === 'coin' || game.q.type === 'count')) b.coins.forEach(c => out.coins.push({ key: c.key, value: c.value, ...scr(c.hit) }));
      if (b.role === 'item') out.items.push({ index: i, price: b.price, ...scr(b.hit) });
    });
    [...$('answers').children].forEach(b => { const r = b.getBoundingClientRect(); out.chips.push({ v: b.dataset.v, disabled: b.disabled, x: r.x + r.width / 2, y: r.y + r.height / 2 }); });
    if (!$('paybar').classList.contains('hidden')) { const r = $('payBtn').getBoundingClientRect(); out.pay = { x: r.x + r.width / 2, y: r.y + r.height / 2 }; }
    return out;
  },
  greedy,
};
</script>
