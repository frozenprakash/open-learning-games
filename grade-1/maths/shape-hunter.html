<title>Shape Hunter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">

<!--
  🔍 SHAPE HUNTER — Grade 1 maths game
  A picnic in the park is full of things. Find the ones with the right shape!
  Works with mouse (computer) and touch (phone/tablet). Drag to turn the picnic a little.
  To change the objects or the levels, scroll to "EASY-TO-EDIT SETTINGS" in the script below.
-->
<style>
  :root {
    --ink: #1d3557;
    --card: rgba(255, 255, 255, 0.94);
    --pink: #ff4d6d;
    --grass: #7bc950;
    --good: #2a9d8f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--grass);
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; }

  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 0; }
  .chip { pointer-events: auto; background: var(--card); color: var(--ink); border: 0; border-radius: 999px;
    min-height: 44px; min-width: 44px; padding: 4px 14px; font: inherit; font-size: 20px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 3px 0 rgba(0,0,0,.13); }
  button.chip { cursor: pointer; touch-action: manipulation; }
  #stats { gap: 14px; }
  #starCount.bump { animation: bump .5s; display: inline-block; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }

  /* the task card */
  #qcard { position: fixed; z-index: 5; left: 0; right: 0; margin: 0 auto;
    top: calc(60px + env(safe-area-inset-top)); width: min(94vw, 660px);
    background: var(--card); border-radius: 22px; padding: 6px 14px 8px; text-align: center; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.13); }
  #qcard.enter { animation: cardIn .35s ease-out; }
  @keyframes cardIn { from { transform: scale(.85); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  #qrow { display: flex; align-items: center; justify-content: center; gap: 10px; }
  #qicon { flex: none; width: clamp(50px, 13vw, 72px); height: clamp(50px, 13vw, 72px); }
  #qicon svg { width: 100%; height: 100%; display: block; }
  #qwords { line-height: 1.08; }
  #qlead { font-size: clamp(17px, 4.6vw, 24px); font-weight: 600; opacity: .85; }
  #qbig { font-size: clamp(27px, 7.6vw, 44px); font-weight: 800; color: #e63946; }
  #qsub { font-size: clamp(15px, 4vw, 20px); font-weight: 600; opacity: .85; min-height: 1.3em; line-height: 1.25; margin-top: 2px; }
  #qsub .again { opacity: .55; font-size: .85em; }
  #slots { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
  .slot { width: 42px; height: 42px; border-radius: 50%; border: 3px dashed #a8b8cc; background: #f1f6fb;
    display: flex; align-items: center; justify-content: center; }
  .slot svg { width: 34px; height: 34px; }
  .slot.got { border: 3px solid #2a9d8f; background: #e7fbf3; animation: slotPop .45s ease-out; }
  @keyframes slotPop { 0% { transform: scale(.4); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  #count { font-size: 20px; font-weight: 800; margin-left: 6px; min-width: 3.2em; }

  #toast { position: fixed; z-index: 6; left: 50%; top: 52%; transform: translate(-50%, -50%) scale(0);
    font-size: clamp(36px, 10vw, 64px); font-weight: 800; color: #fff; white-space: nowrap; pointer-events: none;
    text-shadow: 0 4px 0 var(--good), 0 8px 16px rgba(0,0,0,.25); }
  #toast.soft { text-shadow: 0 4px 0 #e76f51, 0 8px 16px rgba(0,0,0,.25); }
  #toast.show { animation: toastIn 1.3s ease-out forwards; }
  @keyframes toastIn {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    20% { transform: translate(-50%, -50%) scale(1.15); }
    35% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
  }

  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px 16px; text-align: center;
    background: rgba(123, 201, 80, .38); }
  .overlay h1 { margin: 0; font-size: clamp(42px, 12vw, 80px); line-height: 1; color: #fff;
    text-shadow: 0 5px 0 var(--pink), 0 8px 18px rgba(0,0,0,.25); }
  .overlay .say { margin: 0; font-size: clamp(18px, 4.8vw, 24px); font-weight: 600;
    background: var(--card); padding: 6px 18px; border-radius: 16px; }
  .levels { display: flex; flex-direction: column; gap: 12px; width: min(88vw, 380px); margin-top: 6px; }
  .lvl { font: inherit; border: 0; border-radius: 22px; padding: 10px 18px; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
    box-shadow: 0 6px 0 rgba(0,0,0,.2); touch-action: manipulation; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .lvl:active, .big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .lvl b { font-size: 28px; display: block; line-height: 1.1; }
  .lvl small { font-size: 15px; font-weight: 600; }
  .lvl .best { font-size: 20px; white-space: nowrap; }
  .dim { filter: grayscale(1); opacity: .35; }
  .big { font: inherit; font-size: 26px; font-weight: 800; border: 0; border-radius: 20px; padding: 10px 28px;
    color: #fff; background: var(--pink); cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.2); touch-action: manipulation; }
  .big.alt { background: #fff; color: var(--ink); }
  #bigstars { font-size: clamp(60px, 17vw, 104px); letter-spacing: 6px; line-height: 1.1; }
  #newbest { color: #fff; font-weight: 800; font-size: 24px; text-shadow: 0 3px 0 var(--good); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hidden { display: none !important; }
  @media (max-height: 500px) { /* phone turned sideways: task card sits on the left */
    #qcard { margin: 0; left: calc(8px + env(safe-area-inset-left)); right: auto; top: calc(58px + env(safe-area-inset-top));
      width: min(33vw, 300px); padding: 6px 10px 8px; }
    #qrow { flex-direction: column; gap: 2px; }
    #qicon { width: 52px; height: 52px; }
    #qlead { font-size: 17px; }
    #qbig { font-size: 26px; }
    #qsub { font-size: 15px; }
    .slot { width: 36px; height: 36px; }
    .slot svg { width: 28px; height: 28px; }
    #count { font-size: 17px; }
    .overlay { gap: 8px; padding: 10px; }
    .overlay h1 { font-size: 40px; }
    .levels { flex-direction: row; width: min(96vw, 760px); }
    .lvl { flex: 1; flex-direction: column; align-items: flex-start; }
  }
</style>

<body>

<div id="topbar">
  <button class="chip hidden" id="homeBtn" aria-label="Home">🏠</button>
  <div class="chip hidden" id="stats"><span>⭐ <span id="starCount">0</span></span><span id="qnum">1 / 10</span></div>
  <button class="chip" id="muteBtn" aria-label="Sound on or off">🔊</button>
</div>

<div id="qcard" class="hidden" title="Tap to hear the task again">
  <div id="qrow"><div id="qicon"></div><div id="qwords"><div id="qlead"></div><div id="qbig"></div></div></div>
  <div id="qsub"></div>
  <div id="slots"></div>
</div>

<div id="toast"></div>

<div class="overlay" id="startScreen">
  <h1>🔍 Shape Hunter</h1>
  <p class="say">Find the things with the right shape!</p>
  <div class="levels" id="levels"></div>
</div>

<div class="overlay hidden" id="endScreen">
  <h1>You did it!</h1>
  <div id="bigstars"></div>
  <p class="say" id="endmsg"></p>
  <div id="newbest" class="hidden">🏆 New best score!</div>
  <div class="row">
    <button class="big" id="againBtn">Play again</button>
    <button class="big alt" id="levelBtn">Change level</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   EASY-TO-EDIT SETTINGS
   ===================================================================== */
const QUESTIONS_PER_ROUND = 10;   // tasks in one round

// The 5 solid shapes. `like` is the everyday word used on the Easy level.
const SHAPES = {
  sphere:   { name: 'sphere',   plural: 'SPHERES',   like: 'a BALL',           likeSay: 'a ball',
              hint: 'Round all over, like a ball' },
  cube:     { name: 'cube',     plural: 'CUBES',     like: 'a DICE',           likeSay: 'a dice',
              hint: 'Like a dice. Every face is a square' },
  cuboid:   { name: 'cuboid',   plural: 'CUBOIDS',   like: 'a BRICK',          likeSay: 'a brick',
              hint: 'Like a brick or a book. A long box' },

              hint: 'Like a tin can. Flat circles at both ends' },
  cone:     { name: 'cone',     plural: 'CONES',     like: 'an ICE-CREAM CONE', likeSay: 'an ice-cream cone',
              hint: 'Like an ice-cream cone. Round at one end, pointy at the other' },

// Every thing in the park. Remove a line to leave a thing out.
// (Each `kind` has a little 3D model further down, in "THE THINGS".)
const OBJECTS = [
  { kind: 'ball',     name: 'ball',           shape: 'sphere' },
  { kind: 'orange',   name: 'orange',         shape: 'sphere' },
  { kind: 'globe',    name: 'globe',          shape: 'sphere' },
  { kind: 'wool',     name: 'ball of wool',   shape: 'sphere' },
  { kind: 'dice',     name: 'dice',           shape: 'cube' },
  { kind: 'block',    name: 'toy block',      shape: 'cube' },
  { kind: 'gift',     name: 'gift box',       shape: 'cube' },
  { kind: 'brick',    name: 'brick',          shape: 'cuboid' },
  { kind: 'book',     name: 'book',           shape: 'cuboid' },
  { kind: 'juice',    name: 'juice box',      shape: 'cuboid' },
  { kind: 'cereal',   name: 'cereal box',     shape: 'cuboid' },
  { kind: 'can',      name: 'tin can',        shape: 'cylinder' },
  { kind: 'drum',     name: 'drum',           shape: 'cylinder' },
  { kind: 'glass',    name: 'glass',          shape: 'cylinder' },
  { kind: 'pencils',  name: 'pencil cup',     shape: 'cylinder' },
  { kind: 'icecream', name: 'ice-cream cone', shape: 'cone' },
  { kind: 'partyhat', name: 'party hat',      shape: 'cone' },
  { kind: 'traffic',  name: 'traffic cone',   shape: 'cone' },
  { kind: 'bdayhat',  name: 'birthday hat',   shape: 'cone' },

// Hard level: shape facts. `shapes` = the right shapes, `why` = what we say
// when a different shape is tapped. {n} becomes the number to find.
const FACTS = {
  roll:      { shapes: ['sphere', 'cylinder', 'cone'], need: [3], icon: 'roll',
               lead: 'Find {n} shapes that', big: 'can ROLL', sub: 'Give it a push. Does it roll away?',
               say: 'Find {n} shapes that can roll!',
               why: { cube: 'A cube has only flat faces, so it slides. It cannot roll.',
                      cuboid: 'A cuboid has only flat faces, so it slides. It cannot roll.' } },
  stack:     { shapes: ['cube', 'cuboid', 'cylinder'], need: [3], icon: 'stack',
               lead: 'Find {n} shapes you can', big: 'STACK up', sub: 'Things you can pile one on top of another',
               say: 'Find {n} shapes you can stack, one on top of another!',
               why: { sphere: 'A sphere rolls off, so we cannot stack it.',
                      cone: 'A cone has a pointy top, so nothing can sit on it.' } },
  slideOnly: { shapes: ['cube', 'cuboid'], need: [2, 3], icon: 'slide',
               lead: 'Find {n} shapes that slide but', big: "CAN'T ROLL", sub: 'Only flat faces, no round parts',
               say: 'Find {n} shapes that slide, but can not roll!',
               why: { sphere: 'A sphere can roll!', cylinder: 'A cylinder can roll on its side!',
                      cone: 'A cone can roll round and round!' } },
  noFlat:    { shapes: ['sphere'], need: [2, 3], icon: 'noflat',
               lead: 'Find {n} shapes with', big: 'NO flat face', sub: 'Curved all over, no flat part at all',
               say: 'Find {n} shapes with no flat face at all!',
               why: { cube: 'A cube has flat square faces.', cuboid: 'A cuboid has flat faces.',
                      cylinder: 'A cylinder has two flat circle faces.', cone: 'A cone has a flat circle at the bottom.' } },
  circle:    { shapes: ['cylinder', 'cone'], need: [2, 3], icon: 'circle',
               lead: 'Find {n} things with a', big: 'CIRCLE face', sub: 'Trace its flat bottom and you get a circle!',
               say: 'Find {n} things with a flat circle face. If you trace its bottom, you get a circle!',
               why: { sphere: 'A sphere has no flat face at all.', cube: 'The faces of a cube are squares.',
                      cuboid: 'The faces of a cuboid are rectangles.' } },
  square:    { shapes: ['cube'], need: [2], icon: 'square',
               lead: 'Find {n} things with a', big: 'SQUARE face', sub: 'Every face of a dice is a square!',
               say: 'Every face of a dice is a square. Find {n} things with square faces!',
               why: { sphere: 'A sphere has no flat face at all.', cuboid: 'A cuboid has long rectangle faces.',
                      cylinder: 'Its flat faces are circles.', cone: 'Its flat face is a circle.' } },
};

//   things = how many things are in the park for each task
//   need   = how many to find (picked at random)
const LEVELS = {
  easy:   { name: 'Easy',   emoji: '🐣', color: '#5fa61d', things: 7, need: [2, 3], mode: 'like',
            blurb: 'Like a ball, a dice, a can…' },
  medium: { name: 'Medium', emoji: '🐯', color: '#f08c00', things: 8, need: [2, 3], mode: 'name',
            blurb: 'Sphere, cube, cuboid, cylinder, cone' },
  hard:   { name: 'Hard',   emoji: '🦁', color: '#e63946', things: 9, mode: 'fact',
            facts: ['roll', 'roll', 'stack', 'slideOnly', 'noFlat', 'circle', 'circle', 'square'],
            blurb: 'Roll, stack, flat faces' },
};

const PRAISE = ['Great job!', 'Super!', 'Well done!', 'Awesome!', 'You found them all!', 'Fantastic!', 'Brilliant!'];
const CONFETTI_COLORS = [0xff4d6d, 0xffb703, 0x4cc9f0, 0x8ac926, 0xb5179e, 0xfb8500, 0x3a86ff];
const STORE = 'sh-';   // localStorage prefix

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode: ignore */ } },
};
const an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
const NUMW = ['zero', 'one', 'two', 'three', 'four', 'five'];
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ---------- little shape pictures (task card + slots) ---------- */
const ICONS = {
  sphere: `<svg viewBox="0 0 64 64"><defs><radialGradient id="gs" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd1dc"/><stop offset=".45" stop-color="#ff5c8a"/><stop offset="1" stop-color="#c9184a"/></radialGradient></defs><circle cx="32" cy="33" r="25" fill="url(#gs)"/><ellipse cx="24" cy="23" rx="7" ry="4.5" fill="#fff" opacity=".7"/></svg>`,
  cube: `<svg viewBox="0 0 64 64"><path d="M32 7 55 19 32 31 9 19Z" fill="#ffe066"/><path d="M9 19 32 31V57L9 45Z" fill="#f4a300"/><path d="M55 19 32 31V57L55 45Z" fill="#d17a00"/><path d="M32 7 55 19V45L32 57 9 45V19Z" fill="none" stroke="#8a4b00" stroke-width="2" stroke-linejoin="round"/></svg>`,
  cuboid: `<svg viewBox="0 0 64 64"><path d="M22 10 60 22 42 30 4 18Z" fill="#9bf6a0"/><path d="M4 18 42 30V52L4 40Z" fill="#40c057"/><path d="M60 22 42 30V52L60 44Z" fill="#2b8a3e"/><path d="M22 10 60 22V44L42 52 4 40V18Z" fill="none" stroke="#1b5e20" stroke-width="2" stroke-linejoin="round"/></svg>`,
  cylinder: `<svg viewBox="0 0 64 64"><defs><linearGradient id="gc" x1="0" x2="1"><stop offset="0" stop-color="#2f80ed"/><stop offset=".4" stop-color="#7cc4ff"/><stop offset="1" stop-color="#1d5fb8"/></linearGradient></defs><path d="M12 14V50A20 7 0 0 0 52 50V14Z" fill="url(#gc)"/><ellipse cx="32" cy="14" rx="20" ry="7" fill="#bfe3ff" stroke="#1d5fb8" stroke-width="2"/><path d="M12 14V50A20 7 0 0 0 52 50V14" fill="none" stroke="#1d5fb8" stroke-width="2"/></svg>`,
  cone: `<svg viewBox="0 0 64 64"><defs><linearGradient id="gk" x1="0" x2="1"><stop offset="0" stop-color="#9d4edd"/><stop offset=".45" stop-color="#d0a2ff"/><stop offset="1" stop-color="#7b2cbf"/></linearGradient></defs><path d="M32 5 54 50A22 8 0 0 1 10 50Z" fill="url(#gk)" stroke="#5a189a" stroke-width="2" stroke-linejoin="round"/><path d="M10 50A22 8 0 0 0 54 50" fill="none" stroke="#5a189a" stroke-width="2"/></svg>`,
  square: `<svg viewBox="0 0 64 64"><rect x="10" y="10" width="44" height="44" rx="3" fill="#ffb3c6" stroke="#c9184a" stroke-width="3"/></svg>`,
  circle: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="23" fill="#a0d8ff" stroke="#1d5fb8" stroke-width="3"/></svg>`,
  roll: `<svg viewBox="0 0 64 64"><circle cx="30" cy="30" r="17" fill="#ffd166" stroke="#b07d00" stroke-width="2.5"/><path d="M30 13A17 17 0 0 1 47 30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M4 54H60" stroke="#6b8e23" stroke-width="4" stroke-linecap="round"/><path d="M41 40 49 32 51 43" fill="none" stroke="#e63946" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(20 46 38)"/></svg>`,
  stack: `<svg viewBox="0 0 64 64"><rect x="14" y="40" width="36" height="16" rx="2" fill="#4dabf7" stroke="#1864ab" stroke-width="2"/><rect x="18" y="24" width="28" height="16" rx="2" fill="#ffa94d" stroke="#d9480f" stroke-width="2"/><rect x="23" y="8" width="18" height="16" rx="2" fill="#69db7c" stroke="#2b8a3e" stroke-width="2"/></svg>`,
  slide: `<svg viewBox="0 0 64 64"><rect x="24" y="22" width="32" height="26" rx="2" fill="#ffa94d" stroke="#d9480f" stroke-width="2.5"/><path d="M4 26H18M8 35H20M4 44H18" stroke="#868e96" stroke-width="3.5" stroke-linecap="round"/><path d="M4 52H60" stroke="#6b8e23" stroke-width="4" stroke-linecap="round"/></svg>`,
  noflat: `<svg viewBox="0 0 64 64"><defs><radialGradient id="gn" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#e0f7ff"/><stop offset=".5" stop-color="#4cc9f0"/><stop offset="1" stop-color="#1d6fa5"/></radialGradient></defs><circle cx="32" cy="32" r="24" fill="url(#gn)"/><path d="M21 24Q32 16 43 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/></svg>`,
};

/* =====================================================================
   SOUND + VOICE
   ===================================================================== */
let muted = store.get(STORE + 'muted') === '1';
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur = 0.15, type = 'sine', vol = 0.16, when = 0, slide = 0) {
  if (muted) return; const ac = audio(); if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  ding(n) { const f = 660 * Math.pow(1.19, n); tone(f, 0.35, 'sine', 0.16); tone(f * 2, 0.25, 'triangle', 0.05, 0.02); },
  hop() { tone(300, 0.18, 'sine', 0.12, 0, 2.2); },
  whoosh() { tone(900, 0.3, 'sine', 0.05, 0.1, 0.4); },
  wrong() { tone(260, 0.22, 'sine', 0.14); tone(196, 0.3, 'sine', 0.12, 0.12); },
  appear(i) { tone(520 + i * 30, 0.08, 'sine', 0.05, i * 0.06); },
  done() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.14, 0.05 + i * 0.09)); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.14, i * 0.14)); },
};

let voice = null;
const hasSpeech = 'speechSynthesis' in window;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'en-IN') || vs.find(v => v.lang === 'en-GB') || vs.find(v => /^en/.test(v.lang)) || null;
}
if (hasSpeech) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (muted || !hasSpeech || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = voice ? voice.lang : 'en-IN'; u.rate = 0.9; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

const muteBtn = $('muteBtn');
const showMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; };
showMute();
muteBtn.onclick = () => {
  muted = !muted; store.set(STORE + 'muted', muted ? '1' : '0'); showMute();
  if (muted && hasSpeech) speechSynthesis.cancel();
};

/* ---------- canvas textures ---------- */
const texCache = {};
function tex(key, w, h, draw, repeat) {
  if (texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return (texCache[key] = t);
}
let seed = 1;
const srnd = () => { seed = (seed * 16807) % (2 ** 31 - 1); return (seed - 1) / (2 ** 31 - 2); };
const FONT = '"Baloo 2", "Arial Rounded MT Bold", Arial, sans-serif';
function dots(g, n, w, h, r, color) { g.fillStyle = color; for (let i = 0; i < n; i++) { g.beginPath(); g.arc(srnd() * w, srnd() * h, r, 0, 7); g.fill(); } }

  for (let i = 0; i < 500; i++) { g.fillStyle = srnd() < 0.5 ? '#7cbf4c' : '#a2dd73'; g.fillRect(srnd() * w, srnd() * h, 2, 6); }
}, true);

// decorations around the blanket (not tappable)
const deco = new THREE.Group(); scene.add(deco);
function buildDeco(halfW, halfD) {
  deco.clear();
  seed = 99;
  const petalGeo = new THREE.SphereGeometry(0.09, 10, 8), midGeo = new THREE.SphereGeometry(0.07, 10, 8);
  const stemGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.25, 5);
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x2f9e44 }), midMat = new THREE.MeshStandardMaterial({ color: 0xffd43b });
  const petalMats = [0xff6b9a, 0xffffff, 0xb197fc, 0xff922b].map(c => new THREE.MeshStandardMaterial({ color: c }));
  for (let i = 0; i < 70; i++) {
    const x = (srnd() * 2 - 1) * (halfW + 6), z = (srnd() * 2 - 1) * (halfD + 6);
    if (Math.abs(x) < halfW + 0.6 && Math.abs(z) < halfD + 0.6) continue;
    const f = new THREE.Group(), pm = petalMats[i % 4];
    const stem = new THREE.Mesh(stemGeo, stemMat); stem.position.y = 0.12; f.add(stem);
    for (let k = 0; k < 5; k++) { const p = new THREE.Mesh(petalGeo, pm); p.scale.y = 0.4; p.position.set(Math.cos(k * 1.257) * 0.1, 0.26, Math.sin(k * 1.257) * 0.1); f.add(p); }
    const m = new THREE.Mesh(midGeo, midMat); m.position.y = 0.27; f.add(m);
    f.position.set(x, 0, z); f.scale.setScalar(1.3 + srnd() * 0.6);
    deco.add(f);
  }
  const bushMat = new THREE.MeshStandardMaterial({ color: 0x40a33b, roughness: 1 });
  const bushGeo = new THREE.SphereGeometry(0.6, 16, 12);
  for (let i = 0; i < 9; i++) {
    const b = new THREE.Group();
    for (let k = 0; k < 3; k++) { const s = new THREE.Mesh(bushGeo, bushMat); s.position.set((k - 1) * 0.55, 0.35, (k % 2) * 0.2); s.scale.setScalar(0.8 + (k % 2) * 0.35); b.add(s); }
    const side = i % 3;
    b.position.set(side === 0 ? -halfW - 2.5 - srnd() * 3 : side === 1 ? halfW + 2.5 + srnd() * 3 : (srnd() * 2 - 1) * halfW,
                   0, side === 2 ? -halfD - 2.2 - srnd() * 2 : (srnd() * 2 - 1.3) * halfD);
    deco.add(b);
  }
}

const std = o => new THREE.MeshStandardMaterial({ roughness: 0.55, ...o });
const roundBox = (w, h, d, r = 0.06) => new RoundedBoxGeometry(w, h, d, 3, r);

const T = {   // textures
  beach: () => tex('beach', 512, 256, (g, w, h) => {
    const cols = ['#ff3b5c', '#ffffff', '#ffd60a', '#ffffff', '#3a86ff', '#ffffff'];
    cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(i * w / 6, 0, w / 6 + 1, h); });
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, 16); g.fillRect(0, h - 16, w, 16);
  }),
  orange: () => tex('orange', 256, 128, (g, w, h) => { g.fillStyle = '#ff9f1c'; g.fillRect(0, 0, w, h); seed = 3; dots(g, 500, w, h, 1.4, '#f08c00'); dots(g, 200, w, h, 1, '#ffb84d'); }),
  globe: () => tex('globe', 512, 256, (g, w, h) => {
    g.fillStyle = '#2e86de'; g.fillRect(0, 0, w, h);
    seed = 11; g.fillStyle = '#51cf66';
    for (let i = 0; i < 7; i++) { const cx = srnd() * w, cy = 50 + srnd() * 150; for (let k = 0; k < 9; k++) { g.beginPath(); g.ellipse(cx + (srnd() - 0.5) * 70, cy + (srnd() - 0.5) * 50, 14 + srnd() * 26, 10 + srnd() * 18, srnd() * 3, 0, 7); g.fill(); } }
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, 14); g.fillRect(0, h - 14, w, 14);
  }),
  wool: () => tex('wool', 256, 256, (g, w, h) => {
    g.fillStyle = '#ff6fae'; g.fillRect(0, 0, w, h); g.lineWidth = 4;
    seed = 5;
    for (let i = 0; i < 46; i++) {
      g.strokeStyle = i % 2 ? '#ff9cc8' : '#e64d94'; g.beginPath();
      const y0 = srnd() * h, a = 6 + srnd() * 14, f = 0.02 + srnd() * 0.03, ph = srnd() * 6;
      for (let x = 0; x <= w; x += 6) g.lineTo(x, y0 + Math.sin(x * f + ph) * a);
      g.stroke();
    }
  }),
  diceFace: n => tex('dice' + n, 128, 128, (g, w) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, w);
    const P = { 1: [[.5, .5]], 2: [[.27, .27], [.73, .73]], 3: [[.25, .25], [.5, .5], [.75, .75]], 4: [[.27, .27], [.73, .27], [.27, .73], [.73, .73]],
      5: [[.25, .25], [.75, .25], [.5, .5], [.25, .75], [.75, .75]], 6: [[.28, .22], [.72, .22], [.28, .5], [.72, .5], [.28, .78], [.72, .78]] }[n];
    g.fillStyle = n === 1 ? '#e03131' : '#1d3557';
    for (const [x, y] of P) { g.beginPath(); g.arc(x * w, y * w, n === 1 ? 17 : 12, 0, 7); g.fill(); }
  }),
  blockFace: (letter, bg) => tex('blk' + letter + bg, 128, 128, (g, w) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, w);
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 7; g.strokeRect(12, 12, w - 24, w - 24);
    g.font = `800 82px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#ffffff';
    g.fillText(letter, w / 2, w / 2 + 6);
  }),
  giftSide: (bg, rb) => tex('gift' + bg, 128, 128, (g, w) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, w); seed = 4; dots(g, 14, w, w, 5, 'rgba(255,255,255,.5)');
    g.fillStyle = rb; g.fillRect(w / 2 - 12, 0, 24, w);
  }),
  giftTop: (bg, rb) => tex('gifttop' + bg, 128, 128, (g, w) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, w); seed = 4; dots(g, 14, w, w, 5, 'rgba(255,255,255,.5)');
    g.fillStyle = rb; g.fillRect(w / 2 - 12, 0, 24, w); g.fillRect(0, w / 2 - 12, w, 24);
  }),
  brick: () => tex('brick', 256, 128, (g, w, h) => { g.fillStyle = '#c4552d'; g.fillRect(0, 0, w, h); seed = 8; dots(g, 300, w, h, 1.6, '#a8431f'); dots(g, 120, w, h, 1.4, '#dc7a50'); }),
  bookCover: () => tex('bookcover', 256, 320, (g, w, h) => {
    g.fillStyle = '#4263eb'; g.fillRect(0, 0, w, h);

    for (let i = 0; i < 10; i++) { const r = i % 2 ? 28 : 62, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(w / 2 + Math.cos(a) * r, h * 0.55 + Math.sin(a) * r); }
    g.fill();
    g.fillStyle = '#ffffff'; g.fillRect(40, 34, w - 80, 22); g.fillRect(70, 66, w - 140, 14);

  }),
  pages: () => tex('pages', 128, 64, (g, w, h) => { g.fillStyle = '#fffbea'; g.fillRect(0, 0, w, h); g.fillStyle = '#e8dfc0'; for (let y = 4; y < h; y += 6) g.fillRect(0, y, w, 1.5); }),
  juice: () => tex('juice', 128, 224, (g, w, h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.fillStyle = '#40c057'; g.fillRect(0, h * 0.72, w, h * 0.28);
    g.fillStyle = '#ff922b'; g.beginPath(); g.arc(w / 2, h * 0.42, 36, 0, 7); g.fill();
    g.fillStyle = '#2b8a3e'; g.beginPath(); g.ellipse(w / 2 + 14, h * 0.42 - 38, 14, 7, -0.5, 0, 7); g.fill();
    g.font = `800 30px ${FONT}`; g.textAlign = 'center'; g.fillStyle = '#ffffff'; g.fillText('JUICE', w / 2, h * 0.9);
  }),
  cereal: () => tex('cereal', 160, 224, (g, w, h) => {
    g.fillStyle = '#ffd43b'; g.fillRect(0, 0, w, h); g.fillStyle = '#e03131'; g.fillRect(0, 0, w, 58);
    g.font = `800 38px ${FONT}`; g.textAlign = 'center'; g.fillStyle = '#ffffff'; g.fillText('FLAKES', w / 2, 44);
    g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(w / 2, h * 0.66, 58, 30, 0, 0, Math.PI); g.fill();
    g.fillStyle = '#f59f00'; for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(w / 2 - 44 + i * 11, h * 0.64 - (i % 2) * 8, 10, 6, i, 0, 7); g.fill(); }
  }),
  canLabel: () => tex('canlabel', 256, 128, (g, w, h) => {
    g.fillStyle = '#e63946'; g.fillRect(0, 0, w, h); g.fillStyle = '#ffffff'; g.fillRect(0, h * 0.28, w, h * 0.44);
    g.fillStyle = '#2f9e44'; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(32 + i * 64, h / 2, 18, 0, 7); g.fill(); }
  }),
  metal: () => tex('metal', 64, 64, (g, w) => { const gr = g.createRadialGradient(w / 2, w / 2, 4, w / 2, w / 2, w / 2); gr.addColorStop(0, '#e9ecef'); gr.addColorStop(0.8, '#ced4da'); gr.addColorStop(0.9, '#adb5bd'); gr.addColorStop(1, '#868e96'); g.fillStyle = gr; g.fillRect(0, 0, w, w); }),
  drum: () => tex('drum', 256, 96, (g, w, h) => {
    g.fillStyle = '#e03131'; g.fillRect(0, 0, w, h); g.strokeStyle = '#ffe066'; g.lineWidth = 5; g.beginPath();
    for (let i = 0; i <= 8; i++) g.lineTo(i * w / 8, i % 2 ? h - 10 : 10); g.stroke();
  }),
  cup: () => tex('cup', 256, 128, (g, w, h) => { g.fillStyle = '#15aabf'; g.fillRect(0, 0, w, h); seed = 21; dots(g, 26, w, h, 7, '#ffffff'); }),
  waffle: () => tex('waffle', 256, 128, (g, w, h) => {
    g.fillStyle = '#e8a75a'; g.fillRect(0, 0, w, h); g.strokeStyle = '#b8732c'; g.lineWidth = 4;
    for (let i = -h; i < w + h; i += 24) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke(); g.beginPath(); g.moveTo(i + h, 0); g.lineTo(i, h); g.stroke(); }
  }),
  hatStripes: () => tex('hatstripes', 256, 64, (g, w, h) => { for (let i = 0; i < 10; i++) { g.fillStyle = i % 2 ? '#ffd43b' : '#f06595'; g.fillRect(i * w / 10, 0, w / 10 + 1, h); } }),
  hatDots: () => tex('hatdots', 256, 128, (g, w, h) => { g.fillStyle = '#4dabf7'; g.fillRect(0, 0, w, h); seed = 13; dots(g, 30, w, h, 7, '#ffe066'); }),
  traffic: () => tex('traffic', 64, 128, (g, w, h) => { g.fillStyle = '#ff6b00'; g.fillRect(0, 0, w, h); g.fillStyle = '#ffffff'; g.fillRect(0, h * 0.28, w, h * 0.13); g.fillRect(0, h * 0.56, w, h * 0.13); }),
};
const pastel = () => pick(['#ff6b6b', '#4dabf7', '#51cf66', '#fcc419', '#cc5de8', '#ff922b']);

// Each builder returns { body, h } — body is a Group standing on y = 0, h = its height.
const BUILD = {

  orange() {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.46, 36, 24), std({ map: T.orange(), roughness: 0.75 })); m.position.y = 0.45; m.scale.y = 0.96;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.1, 6), std({ color: 0x6b4226 })); stem.position.y = 0.93;
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), std({ color: 0x2f9e44 })); leaf.scale.set(1.7, 0.35, 0.8); leaf.position.set(0.12, 0.93, 0); leaf.rotation.z = -0.4;

  wool() { const m = new THREE.Mesh(new THREE.SphereGeometry(0.46, 36, 24), std({ map: T.wool(), roughness: 0.95 })); m.position.y = 0.46; m.rotation.set(0.7, 0.3, 0.2); return grp([m], 0.92); },
  dice() {

const grid = { cols: 3, rows: 3, perm: [] };
let yaw = 0;
function freeRegion() {
  const W = window.innerWidth, H = window.innerHeight;

  const card = $('qcard');
  if (card.classList.contains('hidden')) return { x0: 0, x1: W, y0: top, y1: H - 6 };
  const r = card.getBoundingClientRect();
  const below = { x0: 0, x1: W, y0: r.bottom + 8, y1: H - 6 };
  const right = { x0: r.right + 8, x1: W, y0: top, y1: H - 6 };
  const score = q => Math.min(q.x1 - q.x0, (q.y1 - q.y0) * 1.4) * Math.sqrt((q.x1 - q.x0) * (q.y1 - q.y0));

}
function chooseGrid(n, reg) {

  for (let cols = 2; cols <= Math.min(6, Math.max(2, n)); cols++) {
    const rows = Math.ceil(n / cols);
    const s = Math.min(w / cols, h / (rows * 0.82 + 0.4)) - (cols * rows - n) * 2;
    if (!best || s > best.s) best = { cols, rows, s };

}
function cellPos(i) {

}

  objs.forEach((o, i) => {
    const [x, z] = cellPos(grid.perm[i]);
    o.group.position.set(x + o.jx, 0, z + o.jz);

  if (inLast.length && inLast.length < grid.cols) {

      .forEach((o, k) => { o.group.position.x = (k - (inLast.length - 1) / 2) * CELL + o.jx; });

function fitCamera(reg, halfW, halfD, topH) {
  const W = window.innerWidth, H = window.innerHeight;
  const R = { x0: reg.x0 / W * 2 - 1 + 0.03, x1: reg.x1 / W * 2 - 1 - 0.03, y0: 1 - reg.y1 / H * 2 + 0.03, y1: 1 - reg.y0 / H * 2 - 0.02 };

  const dir = new THREE.Vector3(0, Math.sin(PITCH), Math.cos(PITCH));

  let dist = 14;
  const tanH = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  for (let it = 0; it < 80; it++) {

    let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
    for (const p of pts) { v.copy(p).project(camera); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }

/* =====================================================================
   TASKS
   ===================================================================== */
const byShape = s => OBJECTS.filter(o => o.shape === s);
const ALL_SHAPES = Object.keys(SHAPES);

// pick `count` things whose shape is in `shapes`, mixing shapes and avoiding repeats
function pickThings(shapes, count) {
  const lists = shuffle([...shapes]).map(s => shuffle(byShape(s)));
  const out = [];
  for (let i = 0; out.length < count && i < 200; i++) {
    const L = lists[i % lists.length]; if (!L.length) continue;
    const used = out.filter(o => o.shape === L[0].shape).length;
    out.push(L[used % L.length]);
  }
  return out;
}

function makeTask(L, recent) {
  for (let tries = 0; tries < 20; tries++) {
    let t;
    if (L.mode === 'fact') {
      const key = pick(L.facts), F = FACTS[key], need = pick(F.need);
      const fill = s => s.replace('{n}', need);
      t = { key, need, shapes: F.shapes, lead: fill(F.lead), big: F.big, sub: F.sub, say: fill(F.say), icon: ICONS[F.icon], why: F.why };
    } else {
      const shape = pick(ALL_SHAPES), S = SHAPES[shape], need = pick(L.need);
      if (L.mode === 'like') {
        t = { key: shape, need, shapes: [shape], lead: `Find ${need} things shaped like`, big: S.like, sub: '',
          say: `Find ${need} things shaped like ${S.likeSay}!`, icon: ICONS[shape] };
      } else {
        t = { key: shape, need, shapes: [shape], lead: `Find ${need}`, big: S.plural, sub: S.hint,
          say: `Find ${need} ${S.plural.toLowerCase()}! ${S.hint}.`, icon: ICONS[shape] };
      }
    }
    if (!recent.includes(t.key) || tries === 19) return t;
  }
}

function thingsFor(task, total) {
  let others = ALL_SHAPES.filter(s => !task.shapes.includes(s));
  // on Easy, keep cube and cuboid apart so it is not too tricky
  if (game.L.mode === 'like') {
    if (task.shapes[0] === 'cube') others = others.filter(s => s !== 'cuboid');
    if (task.shapes[0] === 'cuboid') others = others.filter(s => s !== 'cube');
  }
  const right = pickThings(task.shapes, task.need).map(o => ({ ...o, correct: true }));
  const wrong = pickThings(others, total - task.need).map(o => ({ ...o, correct: false }));
  return shuffle([...right, ...wrong]);
}

const game = { playing: false, levelKey: null, L: null, qi: 0, stars: 0, task: null, found: 0, wrong: 0, busy: false, recent: [] };
let nextTimer = null;

  $('qnum').textContent = `${Math.min(game.qi + 1, QUESTIONS_PER_ROUND)} / ${QUESTIONS_PER_ROUND}`;

  clearThings();
  spawnThings(shuffle(['ball', 'dice', 'brick', 'can', 'icecream', 'globe', 'gift', 'partyhat', 'drum'])
    .map(k => OBJECTS.find(o => o.kind === k)).filter(Boolean));
}

function startGame(key) {
  audio();
  Object.assign(game, { playing: true, levelKey: key, L: LEVELS[key], qi: 0, stars: 0, recent: [] });
  $('startScreen').classList.add('hidden'); $('endScreen').classList.add('hidden');
  ['qcard', 'stats', 'homeBtn'].forEach(id => $(id).classList.remove('hidden'));
  nextTask();
}

function nextTask() {
  clearTimeout(nextTimer);
  clearThings();
  if (game.qi >= QUESTIONS_PER_ROUND) return endGame();
  const t = makeTask(game.L, game.recent);
  game.recent.push(t.key); if (game.recent.length > 2) game.recent.shift();
  Object.assign(game, { task: t, found: 0, wrong: 0, busy: false });
  setCard(t); updateHud();
  spawnThings(thingsFor(t, game.L.things));
  say(t.say);
}

function wrongWords(o) {
  const t = game.task, S = SHAPES[o.shape];
  const why = t.why && t.why[o.shape] ? ' ' + t.why[o.shape] : '';
  return { show: `That's ${an(o.name)}. It's ${an(S.name)} 🙂`, say: `That's ${an(o.name)}. It's ${an(S.name)}.${why} Try again!` };
}

function tapThing(o) {
  if (!game.playing || game.busy || o.state === 'hop' || o.state === 'fly' || o.state === 'leave') return;
  const t = game.task;
  if (o.correct) {
    game.found++;
    o.state = 'hop'; o.t = 0; o.hint = false; o.slotIndex = game.found;
    addGlow(o); setGlow(o, 0.5);
    sfx.ding(game.found); sfx.hop();
    sparkle(o.group.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, o.h / 2, 0)), 10, 0.45);
    $('count').textContent = `${game.found} of ${t.need}`;
    if (game.found >= t.need) {
      game.busy = true;
      if (game.wrong <= 1) game.stars++;
      game.qi++;
      updateHud(game.wrong <= 1);
      const msg = game.wrong <= 1 ? pick(PRAISE) : 'You found them all!';
      setTimeout(() => {
        if (!game.playing || game.task !== t) return;
        toast(msg); sfx.done(); say(`${cap(NUMW[game.found] || String(game.found))}! ${msg}`);
        confetti(new THREE.Vector3(0, 1.2, 0), 60, 1.2);
        $('qsub').textContent = `${msg} 🎉`;
      }, 450);
      nextTimer = setTimeout(nextTask, 2600);
    } else {
      say(`Yes! ${cap(an(o.name))}. ${cap(NUMW[game.found])}!`);
    }
  } else {
    o.shake = 1;
    const w = wrongWords(o);
    if (!o.wrongTapped) {
      o.wrongTapped = true; game.wrong++;
      o.label = labelSprite(o.name, SHAPES[o.shape].name);
      o.label.position.y = o.h + 0.5; o.group.add(o.label);
    }
    sfx.wrong();
    let speech = w.say, show = w.show;
    if (game.wrong >= 2) {

}

  $('bigstars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'dim'}">⭐</span>`).join('');
  $('endmsg').textContent = `You got ${s} out of ${N} stars! You are a shape hunter!`;
  const key = `${STORE}best-${game.levelKey}`, best = Number(store.get(key) || 0);
  $('newbest').classList.toggle('hidden', !(s > best));
  if (s > best) store.set(key, String(s));
  $('endScreen').classList.remove('hidden');
  layout();
  sfx.fanfare();
  say(`You got ${s} out of ${N} stars! ${stars === 3 ? 'Amazing shape hunting!' : stars === 2 ? 'Great hunting!' : 'Good try! Let\'s play again!'}`);
  for (let i = 0; i < 4; i++) setTimeout(() => confetti(new THREE.Vector3((Math.random() - 0.5) * 4, 1, (Math.random() - 0.5) * 2), 40, 1.3), i * 250);
  setTimeout(showDemo, 500);
}

function goHome() {
  game.playing = false; clearTimeout(nextTimer);
  if (hasSpeech) speechSynthesis.cancel();
  ['qcard', 'stats', 'homeBtn'].forEach(id => $(id).classList.add('hidden'));
  $('endScreen').classList.add('hidden');
  buildLevelButtons();
  $('startScreen').classList.remove('hidden');
  showDemo();
}

function buildLevelButtons() {
  const box = $('levels'); box.innerHTML = '';
  for (const [key, L] of Object.entries(LEVELS)) {
    const best = Number(store.get(`${STORE}best-${key}`) || 0);
    const st = best >= Math.ceil(QUESTIONS_PER_ROUND * 0.9) ? 3 : best >= Math.ceil(QUESTIONS_PER_ROUND * 0.6) ? 2 : best > 0 ? 1 : 0;
    const btn = document.createElement('button');
    btn.className = 'lvl'; btn.style.background = L.color;
    btn.innerHTML = `<span><b>${L.emoji} ${L.name}</b><small>${L.blurb}</small></span>
      <span class="best">${[0, 1, 2].map(i => `<span class="${i < st ? '' : 'dim'}">⭐</span>`).join('')}</span>`;
    btn.onclick = () => startGame(key);
    box.appendChild(btn);
  }
}

$('homeBtn').onclick = goHome;
$('againBtn').onclick = () => startGame(game.levelKey);
$('levelBtn').onclick = goHome;
$('qcard').onclick = () => game.playing && game.task && say(game.task.say);

/* ---------- tap (or drag to turn the picnic a little) ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let ptr = null;
function thingAt(x, y) {
  ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const live = objs.filter(o => o.state === 'idle' || o.state === 'appear');
  // first: the thing you can actually see under the finger; else the (bigger) invisible tap zone
  const seen = ray.intersectObjects(live.map(o => o.body), true)[0];
  if (seen) { let m = seen.object; while (m && !m.userData.thing) m = m.parent; if (m) return m.userData.thing; }
  const hits = ray.intersectObjects(live.map(o => o.hit), false);
  return hits[0] ? hits[0].object.userData.thing : null;
}
canvas.addEventListener('pointerdown', e => {
  audio();
  if (ptr) return;
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, drag: false, yaw0: yaw, thr: e.pointerType === 'mouse' ? 8 : 18 };
  try { canvas.setPointerCapture(e.pointerId); } catch { /* fine */ }
});
canvas.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (!ptr.drag && Math.hypot(dx, dy) > ptr.thr) ptr.drag = true;
  if (ptr.drag) yaw = clamp(ptr.yaw0 + dx * 0.006, -0.55, 0.55);
});
canvas.addEventListener('pointerup', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const p = ptr; ptr = null;
  if (!p.drag && game.playing) { const o = thingAt(p.x, p.y); if (o) tapThing(o); }
});
canvas.addEventListener('pointercancel', () => { ptr = null; });

/* =====================================================================
   ANIMATION LOOP
   ===================================================================== */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
const easeBack = p => 1 + 2.7 * Math.pow(p - 1, 3) + 1.7 * Math.pow(p - 1, 2);
function slotTarget(i) {
  const slot = $('slots').children[i - 1] || $('slots').children[0];
  const r = slot ? slot.getBoundingClientRect() : { left: innerWidth / 2, top: 80, width: 40, height: 40 };
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const d = 5;
  const worldSize = r.height / innerHeight * 2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * d;
  return { pos: ray.ray.origin.clone().addScaledVector(ray.ray.direction, d), scale: worldSize * 0.9 };
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  if (!ptr?.drag) yaw += (0 - yaw) * Math.min(1, dt * 1.6);
  board.rotation.y = yaw;

  for (const o of objs) {
    const b = o.body;
    o.t += dt;
    if (o.state === 'appear') {
      const p = clamp((o.t - o.delay) / 0.45, 0, 1);
      b.scale.setScalar(Math.max(0.001, easeBack(p)));
      if (p >= 1) o.state = 'idle';
    }
    if (o.state === 'idle') {
      b.rotation.y = o.yaw0 + Math.sin(t * 0.7 + o.phase) * 0.18;
      b.position.y = 0;
      let s = 1;
      if (o.hint) {
        const k = 0.5 + 0.5 * Math.sin(t * 7 + o.phase);
        setGlow(o, 0.08 + 0.14 * k); s = 1 + 0.05 * k;
        b.position.y = Math.abs(Math.sin(t * 4 + o.phase)) * 0.16;
        o.glow.material.opacity = 0.6 + 0.4 * k; o.glow.scale.setScalar(1 + 0.15 * k);
        if (Math.random() < dt * 4) sparkle(o.group.getWorldPosition(tmp).add(new THREE.Vector3(0, o.h * 0.7, 0)), 1, 0.38);
      }
      b.scale.setScalar(s);
    }
    if (o.shake > 0) {
      o.shake = Math.max(0, o.shake - dt * 1.8);
      b.rotation.z = Math.sin(t * 38) * 0.22 * o.shake;
      b.position.x = Math.sin(t * 38 + 1) * 0.06 * o.shake;
    }
    if (o.state === 'hop') {
      const p = clamp(o.t / 0.5, 0, 1);
      b.position.y = Math.sin(p * Math.PI) * 0.9;
      b.rotation.y += dt * 9; b.rotation.z = 0;
      b.scale.setScalar(1 + 0.15 * Math.sin(p * Math.PI));
      o.shadow.scale.setScalar(1 - 0.5 * Math.sin(p * Math.PI));
      if (o.glow) o.glow.material.opacity = 1;
      if (p >= 1) {
        o.state = 'fly'; o.t = 0;
        scene.attach(o.group); o.shadow.visible = false;
        if (o.glow) o.glow.visible = false;
        o.from = o.group.position.clone(); o.to = slotTarget(o.slotIndex);
        b.position.y = 0.25;
        sfx.whoosh();
      }
    }
  }
  objs = objs.filter(o => {
    if (o.state !== 'fly') return true;
    leaving.push(o); return false;
  });

  for (const o of leaving) {
    o.t += dt;
    if (o.state === 'leave') {
      const p = clamp(o.t / 0.3, 0, 1);
      o.body.scale.setScalar(Math.max(0.001, 1 - p));
      if (o.glow) o.glow.material.opacity = 1 - p;
      if (o.label) o.label.material.opacity = 1 - p;
      if (p >= 1) o.done = true;
    } else if (o.state === 'fly') {
      const p = clamp(o.t / 0.6, 0, 1), e = p * p * (3 - 2 * p);
      o.group.position.lerpVectors(o.from, o.to.pos, e);
      o.group.position.y += Math.sin(p * Math.PI) * 1.2;
      o.group.scale.setScalar(1 + (o.to.scale - 1) * e);
      o.body.rotation.y += dt * 8;
      if (p >= 1) {
        o.done = true;
        const slot = $('slots').children[o.slotIndex - 1];
        if (slot && slot.classList.contains('slot')) { slot.innerHTML = ICONS[o.shape]; slot.classList.add('got'); }
      }
    }
  }
  leaving = leaving.filter(o => { if (o.done) { disposeThing(o); return false; } return true; });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); particles.splice(i, 1); continue; }
    p.v.y -= p.g * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.spin) { p.m.rotation.x += p.spin.x * dt; p.m.rotation.y += p.spin.y * dt; p.m.rotation.z += p.spin.z * dt; }
    p.m.material.opacity = Math.min(1, (p.life / p.max) * 2);
  }

  renderer.render(scene, camera);
});

window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { if (document.hidden && hasSpeech) speechSynthesis.cancel(); });
buildLevelButtons();
layout();
// wait (briefly) for the font so the labels on blocks and boxes look right
Promise.race([document.fonts?.ready || Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(showDemo);

// for testing only
window.__test = {
  game, camera,
  get things() {
    return objs.map(o => {
      const p = o.group.localToWorld(new THREE.Vector3(0, o.h * 0.5, 0)).project(camera);
      return { kind: o.kind, name: o.name, shape: o.shape, correct: o.correct, state: o.state, hint: o.hint,
        x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight };
    });
  },
  thingAt: (x, y) => thingAt(x, y)?.kind ?? null,
  gallery: () => { clearThings(); spawnThings(OBJECTS); },
};
</script>
</body>
